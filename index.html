<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAN</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  :root{
    --bg:#ffffff;
    --text:#333333;
    --sub:#888888;
    --muted:#555555;
    --line:#e5e5e5;
    --btn-border:#cccccc;
    --btn-hover:#111111;
    --panel:#ffffff;
    --active-bg:#333333;
    --active-text:#ffffff;
    --input-border:#333333;
  }
  body.dark{
    --bg:#121212;
    --text:#e8e8e8;
    --sub:#9a9a9a;
    --muted:#aaaaaa;
    --line:#2e2e2e;
    --btn-border:#3f3f3f;
    --btn-hover:#ffffff;
    --panel:#1e1e1e;
    --active-bg:#e8e8e8;
    --active-text:#121212;
    --input-border:#666666;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--text);
    transition:background .2s,color .2s;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;border-bottom:1px solid var(--line);
  }
  .left{display:flex;align-items:center;gap:14px}
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:18px;font-weight:700;letter-spacing:1px;
    text-decoration:none;color:var(--text);
  }
  .home-btn,.nav-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 16px;border:1px solid var(--btn-border);border-radius:999px;
    color:var(--muted);font-size:14px;text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .home-btn:hover,.nav-btn:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  .home-btn svg,.nav-btn svg{width:16px;height:16px}
  .mode-switch{
    position:relative;flex:none;
    width:58px;height:30px;
    border:1px solid var(--btn-border);border-radius:999px;
    background:var(--panel);cursor:pointer;
    transition:background .25s,border-color .25s;
  }
  .mode-switch .thumb{
    position:absolute;top:2px;left:2px;
    width:24px;height:24px;border-radius:50%;
    background:#fdfdfd;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    transition:transform .25s,background .25s;
  }
  body.dark .mode-switch .thumb{transform:translateX(30px)}
  .mode-switch .icon{width:14px;height:14px}
  .mode-switch .icon-moon{display:none}
  body.dark .mode-switch .icon-sun{display:none}
  body.dark .mode-switch .icon-moon{display:block}
  .mode-switch:focus-visible{outline:2px solid var(--btn-hover);outline-offset:2px}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:60px 20px}
  .main-title{
    font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:6px;
    text-align:center;line-height:1.2;
  }
  .sub-title{
    margin-top:10px;margin-bottom:30px;text-align:center;
    font-size:15px;color:var(--sub);letter-spacing:2px;
  }
  .search-box{width:100%;max-width:640px}
  .divider{
    width:100%;max-width:640px;height:1px;background:var(--line);
    margin:30px 0;
  }
  .quick-links{
    display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
    margin-bottom:6px;
  }
  .quick-links a{
    padding:8px 22px;border:1px solid var(--btn-border);border-radius:999px;
    color:var(--muted);font-size:14px;text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .quick-links a:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  .engine-tabs{display:flex;gap:8px;margin-bottom:10px}
  .engine-tabs button{
    padding:6px 14px;border:1px solid var(--btn-border);border-radius:6px;
    background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;
    transition:color .15s,border-color .15s;
  }
  .engine-tabs button.active{background:var(--active-bg);color:var(--active-text);border-color:var(--active-bg)}
  #search-form{display:flex;gap:0}
  #search-input{
    flex:1;min-height:46px;padding:0 16px;border:2px solid var(--input-border);
    border-radius:8px 0 0 8px;font-size:16px;outline:none;
    background:var(--panel);color:var(--text);
  }
  #search-form button{
    min-height:46px;padding:0 24px;border:none;border-radius:0 8px 8px 0;
    background:var(--active-bg);color:var(--active-text);font-size:15px;cursor:pointer;
  }
  .quote{
    margin-top:24px;max-width:640px;text-align:center;
    font-size:15px;color:var(--muted);line-height:1.8;
  }
  .quote #quote-src{font-size:13px;color:var(--sub)}
  footer{
    padding:18px 20px;text-align:center;
    font-size:13px;color:var(--sub);border-top:1px solid var(--line);
  }
  footer a{
    color:var(--muted);text-decoration:none;margin:0 4px;
    transition:color .15s;
  }
  footer a:hover{color:var(--btn-hover)}
  footer .sep{color:var(--line);margin:0 2px}
</style>
</head>
<body>

<header class="topbar">
  <div class="left">
    <a class="brand" href="index.html">HEAN</a>
    <a class="home-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 11l9-8 9 8"/>
        <path d="M5 10v10h14V10"/>
      </svg>
      主页
    </a>
    <a class="nav-btn" href="nav.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
      导航页
    </a>
  </div>
  <button class="mode-switch" id="mode-btn" type="button" role="switch" aria-checked="false" aria-label="切换日间/夜间模式">
    <span class="thumb">
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M19 5l-1.6 1.6M6.6 17.4L5 19"/>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="#8b7cff" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7.2 7.2 0 0 0 9.8 9.8z"/>
      </svg>
    </span>
  </button>
</header>

<main>
  <h1 class="main-title">HEAN 禾安</h1>
  <p class="sub-title">Vik Hean Core</p>

  <section class="search-box">
    <div class="engine-tabs" id="engine-tabs">
      <button type="button" data-engine="bing" class="active">微软Bing</button>
      <button type="button" data-engine="baidu">百度</button>
      <button type="button" data-engine="sogou">搜狗</button>
      <button type="button" data-engine="google">Google</button>
      <button type="button" data-engine="yandex">Yandex</button>
    </div>
    <form id="search-form" action="javascript:void(0)">
      <input type="text" id="search-input" placeholder="搜索一下" autocomplete="off">
      <button type="submit">搜索</button>
    </form>
  </section>

  <section class="quote">
    <p id="quote-text">加载中…</p>
    <p id="quote-src"></p>
  </section>

  <div class="divider"></div>
  <nav class="quick-links">
    <a href="cs2.html">cs2</a>
    <a href="sky.html">光遇</a>
    <a href="nav.html">导航页</a>
    <a href="news.html">新闻</a>
    <a href="test.html">测试页</a>
  </nav>
</main>

<footer>
  <p>Copyright © 2026 hean.me All Rights Reserved <a href="disclaimer.html">免责声明</a><span class="sep">|</span><a href="about.html">关于本站</a></p>
</footer>

<script>
(function () {
  "use strict";

  var engines = {
    bing: "https://www.bing.com/search?q=",
    baidu: "https://www.baidu.com/s?wd=",
    sogou: "https://www.sogou.com/web?query=",
    google: "https://www.google.com/search?q=",
    yandex: "https://yandex.com/search/?text="
  };
  var current = "bing";

  var tabs = document.getElementById("engine-tabs");
  var input = document.getElementById("search-input");
  var form = document.getElementById("search-form");

  tabs.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    current = btn.getAttribute("data-engine");
    tabs.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
    input.focus();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (q === "") return;
    window.open(engines[current] + encodeURIComponent(q), "_blank");
  });

  fetch("https://v1.hitokoto.cn/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      document.getElementById("quote-text").textContent = data.hitokoto;
      document.getElementById("quote-src").textContent = data.from ? "—— " + data.from : "";
    })
    .catch(function () {
      document.getElementById("quote-text").textContent = "每日一言加载失败，请稍后刷新重试。";
    });
})();
</script>

<script>
(function () {
  "use strict";
  var btn = document.getElementById("mode-btn");
  if (!btn) return;
  var KEY = "hean-theme";

  try {
    if (localStorage.getItem(KEY) === "dark") {
      document.body.classList.add("dark");
      btn.setAttribute("aria-checked", "true");
    }
  } catch (e) {}

  btn.addEventListener("click", function () {
    var dark = document.body.classList.toggle("dark");
    btn.setAttribute("aria-checked", dark ? "true" : "false");
    try {
      localStorage.setItem(KEY, dark ? "dark" : "light");
    } catch (e) {}
  });
})();
</script>

</body>
</html>
