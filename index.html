<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAN</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  /* ===== 主题变量：日间模式（默认） ===== */
  :root{
    --bg:#ffffff;
    --text:#333333;
    --sub:#888888;
    --muted:#555555;
    --line:#e5e5e5;
    --btn-border:#cccccc;
    --btn-hover:#111111;
    --panel:#ffffff;
    --active-bg:#333333;
    --active-text:#ffffff;
    --input-border:#333333;
  }
  /* ===== 主题变量：暗黑模式（body 加 dark 类时覆盖） ===== */
  body.dark{
    --bg:#121212;
    --text:#e8e8e8;
    --sub:#9a9a9a;
    --muted:#aaaaaa;
    --line:#2e2e2e;
    --btn-border:#3f3f3f;
    --btn-hover:#ffffff;
    --panel:#1e1e1e;
    --active-bg:#e8e8e8;
    --active-text:#121212;
    --input-border:#666666;
  }
  /* 基础重置 + 页面骨架：flex 纵向布局，主题切换过渡 */
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--text);
    transition:background .2s,color .2s;
  }
  /* 顶栏：左侧品牌与导航按钮，右侧主题开关 */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;border-bottom:1px solid var(--line);
  }
  .left{display:flex;align-items:center;gap:14px}
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:18px;font-weight:700;letter-spacing:1px;
    text-decoration:none;color:var(--text);
  }
  /* 主页 / 导航页 胶囊按钮（带图标） */
  .home-btn,.nav-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 16px;border:1px solid var(--btn-border);border-radius:999px;
    color:var(--muted);font-size:14px;text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .home-btn:hover,.nav-btn:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  .home-btn svg,.nav-btn svg{width:16px;height:16px}
  /* 日间/夜间切换：胶囊滑块开关（内嵌太阳/月亮 SVG） */
  .mode-switch{
    position:relative;flex:none;
    width:58px;height:30px;
    border:1px solid var(--btn-border);border-radius:999px;
    background:var(--panel);cursor:pointer;
    transition:background .25s,border-color .25s;
  }
  .mode-switch .thumb{
    position:absolute;top:2px;left:2px;
    width:24px;height:24px;border-radius:50%;
    background:#fdfdfd;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    transition:transform .25s,background .25s;
  }
  body.dark .mode-switch .thumb{transform:translateX(30px)}
  .mode-switch .icon{width:14px;height:14px}
  .mode-switch .icon-moon{display:none}
  body.dark .mode-switch .icon-sun{display:none}
  body.dark .mode-switch .icon-moon{display:block}
  .mode-switch:focus-visible{outline:2px solid var(--btn-hover);outline-offset:2px}
  /* 主体区域：垂直居中排列 */
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:44px 20px 36px}
  .main-title{
    font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:6px;
    text-align:center;line-height:1.2;
  }
  .sub-title{
    margin-top:10px;margin-bottom:30px;text-align:center;
    font-size:15px;color:var(--sub);letter-spacing:2px;
  }
  /* 搜索框容器（宽幅 960px） */
  .search-box{width:100%;max-width:960px}
  .divider{
    width:100%;max-width:960px;height:1px;background:var(--line);
    margin:26px 0;
  }
  /* 快捷入口：双列卡片网格（导航页大卡片 + 光遇/CS2 + 小按钮） */
  .quick-links{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
    width:100%;max-width:960px;margin-bottom:6px;
  }
  /* 快捷入口卡片 */
  .quick-card{
    display:flex;flex-direction:column;justify-content:center;gap:8px;
    padding:20px 24px;border:1px solid var(--btn-border);border-radius:12px;
    color:var(--text);text-decoration:none;
    transition:border-color .15s,background .15s;
  }
  .quick-card:hover{border-color:var(--btn-hover);background:var(--panel)}
  .quick-card-main{grid-row:span 3}
  .qc-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  .qc-desc{font-size:14px;color:var(--sub)}
  .qc-api{
    font-size:13px;color:var(--sub);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:var(--panel);border:1px dashed var(--btn-border);
    border-radius:6px;padding:6px 8px;align-self:stretch;
    overflow-wrap:anywhere;line-height:1.7;
    white-space:pre-line;
  }
  .quick-card-tall{min-height:290px;justify-content:flex-start;padding:22px 24px}
  .gc-block{
    display:flex;flex-direction:column;gap:6px;
    background:var(--panel);border:1px dashed var(--btn-border);
    border-radius:6px;padding:6px 8px;
  }
  .gc-title{font-size:13px;font-weight:700;color:var(--text)}
  .gc-times{
    display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;
    font-size:12px;color:var(--muted);
  }
  .gc-status{font-size:13px;color:var(--sub);font-weight:600}
  .qc-mini{
    display:flex;gap:10px;align-items:center;justify-content:center;
    padding:12px;border:1px solid var(--btn-border);border-radius:12px;
  }
  .qc-mini a{
    padding:6px 18px;border:1px solid var(--btn-border);border-radius:999px;
    color:var(--muted);font-size:14px;text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .qc-mini a:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  /* 搜索引擎标签栏：图标 + 名称 */
  .engine-tabs{display:flex;gap:8px;margin-bottom:10px}
  .engine-tabs button{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border:1px solid var(--btn-border);border-radius:6px;
    background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;
    transition:color .15s,border-color .15s;
  }
  .engine-tabs button.active{background:var(--active-bg);color:var(--active-text);border-color:var(--active-bg)}
  .e-icon{
    width:18px;height:18px;border-radius:4px;flex:none;
    object-fit:contain;background:#fff;padding:1px;
  }
  #search-form{display:flex;gap:0}
  #search-input{
    flex:1;min-height:46px;padding:0 16px;border:2px solid var(--input-border);
    border-radius:8px 0 0 8px;font-size:16px;outline:none;
    background:var(--panel);color:var(--text);
  }
  #search-form button{
    min-height:46px;padding:0 24px;border:none;border-radius:0 8px 8px 0;
    background:var(--active-bg);color:var(--active-text);font-size:15px;cursor:pointer;
  }
  /* 每日一言：文本与署名并排 */
  .quote{
    margin-top:20px;max-width:960px;text-align:center;
    font-size:15px;color:var(--muted);line-height:1.8;
  }
  .quote-line{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap}
  .quote #quote-src{font-size:13px;color:var(--sub)}
  /* 页脚：版权 + 免责声明 / 关于本站 */
  footer{
    padding:18px 20px;text-align:center;
    font-size:13px;color:var(--sub);border-top:1px solid var(--line);
  }
  footer a{
    color:var(--muted);text-decoration:none;margin:0 4px;
    transition:color .15s;
  }
  footer a:hover{color:var(--btn-hover)}
  footer .sep{color:var(--line);margin:0 2px}
</style>
</head>
<body>

<header class="topbar">
  <div class="left">
    <a class="brand" href="index.html">HEAN</a>
    <a class="home-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 11l9-8 9 8"/>
        <path d="M5 10v10h14V10"/>
      </svg>
      主页
    </a>
    <a class="nav-btn" href="nav.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
      导航页
    </a>
  </div>
  <button class="mode-switch" id="mode-btn" type="button" role="switch" aria-checked="false" aria-label="切换日间/夜间模式">
    <span class="thumb">
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M19 5l-1.6 1.6M6.6 17.4L5 19"/>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="#8b7cff" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7.2 7.2 0 0 0 9.8 9.8z"/>
      </svg>
    </span>
  </button>
</header>

<main>
  <h1 class="main-title">HEAN 禾安</h1>
  <p class="sub-title">Vik Hean Core</p>

  <section class="search-box">
    <div class="engine-tabs" id="engine-tabs">
      <button type="button" data-engine="bing" class="active"><img class="e-icon" src="assets/logo-bing.png" alt="Bing">微软Bing</button>
      <button type="button" data-engine="baidu"><img class="e-icon" src="assets/logo-baidu.png" alt="百度">百度</button>
      <button type="button" data-engine="sogou"><img class="e-icon" src="assets/logo-sogou.png" alt="搜狗">搜狗</button>
      <button type="button" data-engine="google"><img class="e-icon" src="assets/logo-google.png" alt="Google">Google</button>
      <button type="button" data-engine="yandex"><img class="e-icon" src="assets/logo-yandex.png" alt="Yandex">Yandex</button>
    </div>
    <form id="search-form" action="javascript:void(0)">
      <input type="text" id="search-input" placeholder="搜索一下" autocomplete="off">
      <button type="submit">搜索</button>
    </form>
  </section>

  <section class="quote">
    <p class="quote-line"><span id="quote-text">加载中…</span><span id="quote-src"></span></p>
  </section>

  <div class="divider"></div>
  <nav class="quick-links">
    <a class="quick-card quick-card-main" href="nav.html">
      <span class="qc-title">导航页</span>
      <span class="qc-desc">站点导航 · 快速入口</span>
    </a>
    <a class="quick-card quick-card-tall" href="sky.html">
      <span class="qc-title">光遇</span>
      <div class="gc-block">
        <div class="gc-title">老奶奶干饭时间</div>
        <div class="gc-times">
          <span>08:00-08:30</span><span>10:00-10:30</span>
          <span>12:00-12:30</span><span>16:00-16:30</span>
          <span>18:00-18:30</span><span>20:00-20:30</span>
        </div>
        <div class="gc-status" id="gc-status">计算中…</div>
      </div>
      <span class="qc-api" id="sky-api">小陈跑路中…</span>
    </a>
    <a class="quick-card" href="cs2.html">
      <span class="qc-title">CS2</span>
      <span class="qc-api" id="cs2-api">计算中…</span>
    </a>
    <div class="qc-mini">
      <a href="news.html">新闻</a>
      <a href="test.html">测试页</a>
    </div>
  </nav>
</main>

<footer>
  <p>Copyright © 2026 hean.me All Rights Reserved <a href="disclaimer.html">免责声明</a><span class="sep">|</span><a href="about.html">关于本站</a></p>
</footer>

<script>
(function () {
  "use strict";

  /* ===== 搜索引擎配置 =====
     五个引擎的搜索地址前缀，切换标签后提交搜索即跳转对应引擎 */
  var engines = {
    bing: "https://www.bing.com/search?q=",
    baidu: "https://www.baidu.com/s?wd=",
    sogou: "https://www.sogou.com/web?query=",
    google: "https://www.google.com/search?q=",
    yandex: "https://yandex.com/search/?text="
  };
  var current = "bing";

  var tabs = document.getElementById("engine-tabs");
  var input = document.getElementById("search-input");
  var form = document.getElementById("search-form");

  /* 引擎标签切换：更新当前引擎并高亮选中态 */
  tabs.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    current = btn.getAttribute("data-engine");
    tabs.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
    input.focus();
  });

  /* 搜索提交：空关键词忽略，否则新窗口打开当前引擎的搜索结果 */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (q === "") return;
    window.open(engines[current] + encodeURIComponent(q), "_blank");
  });

  /* ===== 每日一言（hitokoto API）：文本与署名并排展示 ===== */
  fetch("https://v1.hitokoto.cn/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      document.getElementById("quote-text").textContent = data.hitokoto;
      document.getElementById("quote-src").textContent = data.from ? "—— " + data.from : "";
    })
    .catch(function () {
      document.getElementById("quote-text").textContent = "每日一言加载失败，请稍后刷新重试。";
    });

  /* ===== 光遇今日任务（展示在首页光遇卡片） ===== */
  fetch("https://api.qmkjcm.cn/api/gy_mr_rw/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("sky-api");
      if (!el || !data.data || !data.data.task_list || !data.data.task_list.length) return;
      var list = data.data.task_list;
      var today = list[0].date;
      var tasks = list.filter(function (t) { return t.date === today; })
                      .map(function (t) { return t.quest_cn; });
      el.textContent = tasks.length ? "今日任务：\n" + tasks.map(function (t, i) { return (i + 1) + ". " + t; }).join("\n") : "今日暂无任务";
    })
    .catch(function () {
      var el = document.getElementById("sky-api");
      if (el) el.textContent = "今日任务加载失败";
    });

  /* ===== CS2 箱子刷新倒计时 =====
     刷新时间：北京时间每周三 09:00（换算为 UTC 01:00） */
  function nextCs2Reset() {
    var now = new Date();
    var t = new Date(now);
    t.setUTCHours(1, 0, 0, 0); /* 北京时间周三 09:00 = UTC 01:00 */
    var dayDiff = (3 - t.getUTCDay() + 7) % 7; /* 距下一个周三的天数 */
    if (dayDiff === 0 && now.getTime() >= t.getTime()) dayDiff = 7;
    t.setUTCDate(t.getUTCDate() + dayDiff);
    return t;
  }
  /* 每秒刷新 CS2 刷新倒计时（天/时/分/秒） */
  function tickCs2() {
    var el = document.getElementById("cs2-api");
    if (!el) return;
    var diff = nextCs2Reset().getTime() - Date.now();
    if (diff < 0) diff = 0;
    var s = Math.floor(diff / 1000);
    var d = Math.floor(s / 86400); s %= 86400;
    var h = Math.floor(s / 3600); s %= 3600;
    var m = Math.floor(s / 60); s %= 60;
    el.textContent = "距离箱子刷新还有 " + d + "天" + h + "时" + m + "分" + s + "秒";
  }
  tickCs2();
  setInterval(tickCs2, 1000);

  /* ===== 老奶奶干饭时间 =====
     6 个派发时段（北京时间 08:00/10:00/12:00/16:00/18:00/20:00，各 30 分钟） */
  var FEED_TIMES = [[8, 0], [10, 0], [12, 0], [16, 0], [18, 0], [20, 0]];
  var FEED_DUR = 30;
  /* 数字补零：8 -> "08" */
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  /* 每秒刷新：时段内显示"派发中"，否则倒计时到下一个时段 */
  function tickFeed() {
    var el = document.getElementById("gc-status");
    if (!el) return;
    var now = new Date(Date.now() + 8 * 3600 * 1000); /* 北京时间 */
    var curMin = now.getUTCHours() * 60 + now.getUTCMinutes();
    var s = now.getUTCSeconds();
    var i;
    for (i = 0; i < FEED_TIMES.length; i++) {
      var start = FEED_TIMES[i][0] * 60 + FEED_TIMES[i][1];
      if (curMin >= start && curMin < start + FEED_DUR) {
        el.textContent = "老奶奶正在派发馒头";
        return;
      }
    }
    var nextIdx = -1, nextStart = 0;
    for (i = 0; i < FEED_TIMES.length; i++) {
      var st = FEED_TIMES[i][0] * 60 + FEED_TIMES[i][1];
      if (curMin < st) { nextIdx = i; nextStart = st; break; }
    }
    var crossDay = false;
    if (nextIdx === -1) { nextIdx = 0; nextStart = FEED_TIMES[0][0] * 60; crossDay = true; }
    var diffMin = nextStart - curMin;
    if (diffMin <= 0) { diffMin += 1440; crossDay = true; }
    var totalSec = diffMin * 60 - s;
    var hh = Math.floor(totalSec / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;
    var label = (crossDay ? "明天 " : "今天 ") + pad2(FEED_TIMES[nextIdx][0]) + ":" + pad2(FEED_TIMES[nextIdx][1]);
    el.textContent = "距离下次干饭还有 " + hh + " 小时 " + mm + " 分 " + ss + " 秒（" + label + "）";
  }
  tickFeed();
  setInterval(tickFeed, 1000);
})();
</script>

<script>
(function () {
  "use strict";
  /* 主题切换：localStorage 存储 key=hean-theme，实现夜间模式跨页记忆 */
  var btn = document.getElementById("mode-btn");
  if (!btn) return;
  var KEY = "hean-theme";

  try {
    if (localStorage.getItem(KEY) === "dark") {
      document.body.classList.add("dark");
      btn.setAttribute("aria-checked", "true");
    }
  } catch (e) {}

  btn.addEventListener("click", function () {
    var dark = document.body.classList.toggle("dark");
    btn.setAttribute("aria-checked", dark ? "true" : "false");
    try {
      localStorage.setItem(KEY, dark ? "dark" : "light");
    } catch (e) {}
  });
})();
</script>

</body>
</html>
