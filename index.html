<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAN</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  /* ===== 主题变量：日间模式（默认） ===== */
  :root{
    --bg:#ffffff;
    --text:#333333;
    --sub:#888888;
    --muted:#555555;
    --line:#e5e5e5;
    --btn-border:#cccccc;
    --btn-hover:#111111;
    --panel:#ffffff;
    --active-bg:#333333;
    --active-text:#ffffff;
    --input-border:#333333;
    --clock-face:#f6f6f6;
  }
  /* ===== 主题变量：暗黑模式（body 加 dark 类时覆盖） ===== */
  body.dark{
    --bg:#121212;
    --text:#e8e8e8;
    --sub:#9a9a9a;
    --muted:#aaaaaa;
    --line:#2e2e2e;
    --btn-border:#3f3f3f;
    --btn-hover:#ffffff;
    --panel:#1e1e1e;
    --active-bg:#e8e8e8;
    --active-text:#121212;
    --input-border:#666666;
    --clock-face:#262626;
  }
  /* 基础重置 + 页面骨架：flex 纵向布局，主题切换过渡 */
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--text);
    transition:background .2s,color .2s;
  }
  /* 顶栏：左侧品牌与导航按钮，右侧主题开关 */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;border-bottom:1px solid var(--line);
  }
  .left{display:flex;align-items:center;gap:14px}
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:18px;font-weight:700;letter-spacing:1px;
    text-decoration:none;color:var(--text);
  }
  /* 主页 / 导航页 胶囊按钮（带图标） */
  .home-btn,.nav-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 16px;border:1px solid var(--btn-border);border-radius:999px;
    color:var(--muted);font-size:14px;text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .home-btn:hover,.nav-btn:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  .home-btn svg,.nav-btn svg{width:16px;height:16px}
  /* 日间/夜间切换：胶囊滑块开关（内嵌太阳/月亮 SVG） */
  .mode-btn{
    display:flex;align-items:center;justify-content:center;
    flex:none;width:34px;height:34px;
    border:1px solid var(--btn-border);border-radius:50%;
    background:var(--panel);cursor:pointer;
    transition:background .25s,border-color .25s;
  }
  .mode-btn:hover{border-color:var(--btn-hover)}
  .mode-btn .icon{width:16px;height:16px}
  .mode-btn .icon-moon{display:none}
  body.dark .mode-btn .icon-sun{display:none}
  body.dark .mode-btn .icon-moon{display:block}
  .mode-btn:focus-visible{outline:2px solid var(--btn-hover);outline-offset:2px}
  /* 主体区域：垂直居中排列 */
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:44px 20px 36px}
  .main-title{
    font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:6px;
    text-align:center;line-height:1.2;
  }
  .sub-title{
    margin-top:10px;margin-bottom:30px;text-align:center;
    font-size:15px;color:var(--sub);letter-spacing:2px;
  }
  /* 搜索框容器（宽幅 960px） */
  .search-box{width:100%;max-width:960px}
  .divider{
    width:100%;max-width:960px;height:1px;background:var(--line);
    margin:26px 0;
  }
  /* 快捷入口：双列卡片网格（导航页大卡片 + 光遇/CS2 + 小按钮） */
  .quick-links{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
    width:100%;max-width:960px;margin-bottom:6px;
  }
  /* 快捷入口卡片 */
  .quick-card{
    display:flex;flex-direction:column;justify-content:center;gap:8px;
    padding:20px 24px;border:1px solid var(--btn-border);border-radius:12px;
    color:var(--text);text-decoration:none;
    transition:border-color .15s,background .15s;
  }
  .quick-card:hover{border-color:var(--btn-hover);background:var(--panel)}
  .quick-card-main{grid-row:span 2}
  .qc-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  .qc-desc{font-size:14px;color:var(--sub)}
  .qc-api{
    font-size:13px;color:var(--sub);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:var(--panel);border:1px dashed var(--btn-border);
    border-radius:6px;padding:6px 8px;align-self:stretch;
    overflow-wrap:anywhere;line-height:1.7;
    white-space:pre-line;
  }
  .quick-card-tall{grid-row:span 2;justify-content:flex-start;padding:22px 24px}
  .gc-block{
    display:flex;flex-direction:column;gap:6px;
    background:var(--panel);border:1px dashed var(--btn-border);
    border-radius:6px;padding:6px 8px;
  }
  .gc-title{font-size:13px;font-weight:700;color:var(--text)}
  .gc-status{font-size:13px;color:var(--sub);font-weight:600}
  /* 干饭圆形时钟：表盘 / 白色实心时间点 / 时间文字 / 指针 */
  .gc-next{font-size:14px;font-weight:700;color:var(--text)}
  .gc-clock-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .gc-clock{flex:none;width:200px;height:200px}
  .gc-clock .face{fill:var(--clock-face);stroke:var(--btn-border);stroke-width:1.5}
  .gc-clock .dot{fill:#ffffff;stroke:var(--btn-border);stroke-width:1}
  .gc-clock .dot.active{fill:#f59e0b;stroke:#f59e0b}
  .gc-clock .tlabel{fill:var(--text);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  .gc-clock .hand{stroke:var(--text);stroke-linecap:round}
  .gc-clock .hand-hr{stroke-width:5}
  .gc-clock .hand-min{stroke-width:3}
  .gc-clock .hand-sec{stroke:#f59e0b;stroke-width:1.6}
  .gc-clock .hub{fill:var(--text)}
  .gc-info{display:flex;flex-direction:column;gap:2px;min-width:120px}
  .gc-info-label{font-size:11px;color:var(--sub)}
  .gc-num{
    font-size:18px;font-weight:700;letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  .gc-state{font-size:13px;font-weight:700;color:var(--sub)}
  .gc-state.active{color:#f59e0b}
  .qc-mini{
    display:flex;gap:10px;align-items:center;justify-content:center;
    padding:12px;border:1px solid var(--btn-border);border-radius:12px;
  }
  .qc-mini a{
    padding:6px 18px;border:1px solid var(--btn-border);border-radius:999px;
    color:var(--muted);font-size:14px;text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .qc-mini a:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  /* 搜索引擎标签栏：图标 + 名称 */
  .engine-tabs{display:flex;gap:8px;margin-bottom:10px}
  .engine-tabs button{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border:1px solid var(--btn-border);border-radius:6px;
    background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;
    transition:color .15s,border-color .15s;
  }
  .engine-tabs button.active{background:var(--active-bg);color:var(--active-text);border-color:var(--active-bg)}
  .e-icon{
    width:18px;height:18px;border-radius:4px;flex:none;
    object-fit:contain;background:#fff;padding:1px;
  }
  #search-form{display:flex;gap:0}
  #search-input{
    flex:1;min-height:46px;padding:0 16px;border:2px solid var(--input-border);
    border-radius:8px 0 0 8px;font-size:16px;outline:none;
    background:var(--panel);color:var(--text);
  }
  #search-form button{
    min-height:46px;padding:0 24px;border:none;border-radius:0 8px 8px 0;
    background:var(--active-bg);color:var(--active-text);font-size:15px;cursor:pointer;
  }
  /* 每日一言：文本与署名并排 */
  .quote{
    margin-top:20px;max-width:960px;text-align:center;
    font-size:15px;color:var(--muted);line-height:1.8;
  }
  .quote-line{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap}
  .quote #quote-src{font-size:13px;color:var(--sub)}
  /* 页脚：版权 + 免责声明 / 关于本站 */
  footer{
    padding:18px 20px;text-align:center;
    font-size:13px;color:var(--sub);border-top:1px solid var(--line);
  }
  footer p+p{margin-top:6px}
  footer a{
    color:var(--muted);text-decoration:none;margin:0 4px;
    transition:color .15s;
  }
  footer a:hover{color:var(--btn-hover)}
  footer .sep{color:var(--line);margin:0 2px}
</style>
</head>
<body>

<header class="topbar">
  <div class="left">
    <a class="brand" href="index.html">HEAN</a>
    <a class="home-btn" href="index.html" title="主页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 11l9-8 9 8"/>
        <path d="M5 10v10h14V10"/>
      </svg>
    </a>
    <a class="nav-btn" href="nav.html" title="导航页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>

  <button class="mode-btn" id="mode-btn" type="button" aria-label="切换日间/夜间模式">

          <svg class="gc-clock" id="gc-clock" viewBox="0 0 260 260" role="img" aria-label="干饭时间时钟">
            <!-- 表盘：无刻度线，仅标注 6 个时间点（由脚本生成圆点与文字） -->
            <circle class="face" cx="130" cy="130" r="118"/>
            <!-- 三根指针：时针 / 分针 / 秒针（初始指向 12 点，脚本每秒更新） -->
            <line class="hand hand-hr" id="hand-hr" x1="130" y1="130" x2="130" y2="85"/>
            <line class="hand hand-min" id="hand-min" x1="130" y1="130" x2="130" y2="68"/>
            <line class="hand hand-sec" id="hand-sec" x1="130" y1="130" x2="130" y2="60"/>

<script>
(function () {
  "use strict";

  /* ===== 搜索引擎配置 =====
     三个引擎的搜索地址前缀，切换标签后提交搜索即跳转对应引擎 */
  var engines = {
    bing: "https://www.bing.com/search?q=",
    baidu: "https://www.baidu.com/s?wd=",
    google: "https://www.google.com/search?q=",
  };
  var current = "bing";

  var tabs = document.getElementById("engine-tabs");
  var input = document.getElementById("search-input");
  var form = document.getElementById("search-form");

  /* 引擎标签切换：更新当前引擎并高亮选中态 */
  tabs.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    current = btn.getAttribute("data-engine");
    tabs.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
    input.focus();
  });

  /* 搜索提交：空关键词忽略，否则新窗口打开当前引擎的搜索结果 */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (q === "") return;
    window.open(engines[current] + encodeURIComponent(q), "_blank");
  });

  /* ===== 每日一言（hitokoto API）：文本与署名并排展示 ===== */
  fetch("https://v1.hitokoto.cn/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      document.getElementById("quote-text").textContent = data.hitokoto;
      document.getElementById("quote-src").textContent = data.from ? "—— " + data.from : "";
    })
    .catch(function () {
      document.getElementById("quote-text").textContent = "每日一言加载失败，请稍后刷新重试。";
    });

  /* ===== 光遇今日任务（展示在首页光遇卡片） ===== */
  fetch("https://api.qmkjcm.cn/api/gy_mr_rw/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("sky-api");
      if (!el || !data.data || !data.data.task_list || !data.data.task_list.length) return;
      var list = data.data.task_list;
      var today = list[0].date;
      var tasks = list.filter(function (t) { return t.date === today; })
                      .map(function (t) { return t.quest_cn; });
      el.textContent = tasks.length ? "今日任务：\n" + tasks.map(function (t, i) { return (i + 1) + ". " + t; }).join("\n") : "今日暂无任务";
    })
    .catch(function () {
      var el = document.getElementById("sky-api");
      if (el) el.textContent = "今日任务加载失败";
    });

  /* ===== CS2 箱子刷新倒计时 =====
     刷新时间：北京时间每周三 09:00（换算为 UTC 01:00） */
  function nextCs2Reset() {
    var now = new Date();
    var t = new Date(now);
    t.setUTCHours(1, 0, 0, 0); /* 北京时间周三 09:00 = UTC 01:00 */
    var dayDiff = (3 - t.getUTCDay() + 7) % 7; /* 距下一个周三的天数 */
    if (dayDiff === 0 && now.getTime() >= t.getTime()) dayDiff = 7;
    t.setUTCDate(t.getUTCDate() + dayDiff);
    return t;
  }
  /* 每秒刷新 CS2 刷新倒计时（天/时/分/秒） */
  function tickCs2() {
    var el = document.getElementById("cs2-api");
    if (!el) return;
    var diff = nextCs2Reset().getTime() - Date.now();
    if (diff < 0) diff = 0;
    var s = Math.floor(diff / 1000);
    var d = Math.floor(s / 86400); s %= 86400;
    var h = Math.floor(s / 3600); s %= 3600;
    var m = Math.floor(s / 60); s %= 60;
    el.textContent = "距离箱子刷新还有 " + d + "天" + h + "时" + m + "分" + s + "秒";
  }
  tickCs2();
  setInterval(tickCs2, 1000);

  /* ===== 老奶奶干饭时间（圆形时钟版） =====
     6 个派发时段（北京时间 08:00/10:00/12:00/16:00/18:00/20:00，各 30 分钟）。
     时钟为无刻度表盘，圆周上按 60° 间隔标注 6 个时间点：
     08:00 位于正上方，顺时针依次 10:00 / 12:00 / 16:00 / 18:00 / 20:00，
     每个时间点内侧放一个白色实心圆点，当前派发时段圆点高亮为橙色。 */
  var FEED_TIMES = [[8, 0], [10, 0], [12, 0], [16, 0], [18, 0], [20, 0]];
  var FEED_DUR = 30;
  /* 数字补零：8 -> "08" */
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  /* 构建时钟：为每个时间点生成白色实心圆点 + 时间文字 */
  (function buildClock() {
    var svg = document.getElementById("gc-clock");
    if (!svg) return;
    var NS = "http://www.w3.org/2000/svg";
    var cx = 130, cy = 130;
    FEED_TIMES.forEach(function (t, i) {
      /* 角度：-90°（正上方）为起点，每 60° 顺时针排列一个时间点 */
      var ang = (-90 + i * 60) * Math.PI / 180;
      /* 白色实心圆点：位于半径 82 处（时间文字内侧） */
      var dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", cx + 82 * Math.cos(ang));
      dot.setAttribute("cy", cy + 82 * Math.sin(ang));
      dot.setAttribute("r", 6);
      dot.setAttribute("class", "dot");
      dot.setAttribute("id", "feed-dot-" + i);
      svg.appendChild(dot);
      /* 时间文字（如 08:00）：位于半径 110 处（圆点外侧） */
      var txt = document.createElementNS(NS, "text");
      txt.setAttribute("x", cx + 110 * Math.cos(ang));
      txt.setAttribute("y", cy + 110 * Math.sin(ang));
      txt.setAttribute("class", "tlabel");
      txt.textContent = pad2(t[0]) + ":" + pad2(t[1]);
      svg.appendChild(txt);
    });
  })();

  /* 每秒刷新：当前时间、干饭状态、倒计时与三根指针 */
  function tickFeed() {
    var elNow = document.getElementById("gc-now");
    var elCount = document.getElementById("gc-countdown");
    var elNext = document.getElementById("gc-next");
    var elLabel = document.getElementById("gc-count-label");
    var elState = document.getElementById("gc-state");
    var handHr = document.getElementById("hand-hr");
    var handMin = document.getElementById("hand-min");
    var handSec = document.getElementById("hand-sec");
    if (!elNow) return;
    var now = new Date(Date.now() + 8 * 3600 * 1000); /* 北京时间 */
    var h = now.getUTCHours(), m = now.getUTCMinutes(), s = now.getUTCSeconds();
    var curMin = h * 60 + m;
    var i;

    /* 右侧：当前时间精确到秒 */
    elNow.textContent = pad2(h) + ":" + pad2(m) + ":" + pad2(s);

    /* 判断当前是否在某个派发时段内（用于高亮圆点） */
    var activeIdx = -1;
    for (i = 0; i < FEED_TIMES.length; i++) {
      var start = FEED_TIMES[i][0] * 60 + FEED_TIMES[i][1];
      if (curMin >= start && curMin < start + FEED_DUR) { activeIdx = i; break; }
    }

    /* 计算下一次派发时段（今天之后或明天） */
    var nextIdx = -1, nextStart = 0;
    for (i = 0; i < FEED_TIMES.length; i++) {
      var st = FEED_TIMES[i][0] * 60 + FEED_TIMES[i][1];
      if (curMin < st) { nextIdx = i; nextStart = st; break; }
    }
    var crossDay = false;
    if (nextIdx === -1) { nextIdx = 0; nextStart = FEED_TIMES[0][0] * 60; crossDay = true; }

    /* 倒计时秒数：派发中为本时段剩余，非派发为距下次开始 */
    var totalSec;
    if (activeIdx >= 0) {
      elNext.textContent = "老奶奶正在派发馒头";
      if (elLabel) elLabel.textContent = "本次派发剩余";
      /* 右侧状态行：派发时段内显示橙色高亮的派发提示 */
      if (elState) {
        elState.textContent = "老奶奶正在派发馒头";
        elState.classList.add("active");
      }
      totalSec = (FEED_TIMES[activeIdx][0] * 60 + FEED_TIMES[activeIdx][1] + FEED_DUR) * 60 - (curMin * 60 + s);
    } else {
      elNext.textContent = (crossDay ? "明天 " : "今天 ") + "干饭：" + pad2(FEED_TIMES[nextIdx][0]) + ":" + pad2(FEED_TIMES[nextIdx][1]);
      if (elLabel) elLabel.textContent = "距离下次干饭";
      /* 右侧状态行：非派发时段显示"现在没饭吃"（常规灰色） */
      if (elState) {
        elState.textContent = "现在没饭吃";
        elState.classList.remove("active");
      }
      var diffMin = nextStart - curMin;
      if (diffMin <= 0) diffMin += 1440;
      totalSec = diffMin * 60 - s;
    }
    if (totalSec < 0) totalSec = 0;
    var hh = Math.floor(totalSec / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;
    /* 倒计时与当前时间同字号同格式，精确到秒 */
    elCount.textContent = pad2(hh) + ":" + pad2(mm) + ":" + pad2(ss);

    /* 高亮当前时段对应的圆点（白色实心圆 -> 橙色） */
    for (i = 0; i < FEED_TIMES.length; i++) {
      var d = document.getElementById("feed-dot-" + i);
      if (d) d.classList.toggle("active", i === activeIdx);
    }

    /* 指针角度：时针 / 分针 / 秒针（从表盘中心向外） */
    var hrAng = ((h % 12) * 30 + m * 0.5) * Math.PI / 180;
    var minAng = (m * 6 + s * 0.1) * Math.PI / 180;
    var secAng = s * 6 * Math.PI / 180;
    if (handHr) {
      handHr.setAttribute("x2", 130 + 45 * Math.sin(hrAng));
      handHr.setAttribute("y2", 130 - 45 * Math.cos(hrAng));
    }
    if (handMin) {
      handMin.setAttribute("x2", 130 + 62 * Math.sin(minAng));
      handMin.setAttribute("y2", 130 - 62 * Math.cos(minAng));
    }
    if (handSec) {
      handSec.setAttribute("x2", 130 + 70 * Math.sin(secAng));
      handSec.setAttribute("y2", 130 - 70 * Math.cos(secAng));
    }
  }
  tickFeed();
  setInterval(tickFeed, 1000);
})();
</script>

<script>
(function () {
  "use strict";
  /* 主题切换：localStorage 存储 key=hean-theme，实现夜间模式跨页记忆 */
  var btn = document.getElementById("mode-btn");
  if (!btn) return;
  var KEY = "hean-theme";

  try {
    if (localStorage.getItem(KEY) === "dark") {
      document.body.classList.add("dark");
      btn.setAttribute("aria-checked", "true");
    }
  } catch (e) {}

  btn.addEventListener("click", function () {
    var dark = document.body.classList.toggle("dark");
    btn.setAttribute("aria-checked", dark ? "true" : "false");
    try {
      localStorage.setItem(KEY, dark ? "dark" : "light");
    } catch (e) {}
  });
})();
</script>
