<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAN 禾安</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
  :root{
    --bg:#ffffff;--text:#333333;--sub:#888888;--muted:#555555;--line:#e5e5e5;
    --btn-border:#cccccc;--btn-hover:#111111;--panel:#ffffff;
    --active-bg:#2563eb;--active-text:#ffffff;--input-border:#2563eb;--clock-face:#f6f6f6;
  }
  html.dark{
    --bg:#121212;--text:#e8e8e8;--sub:#9a9a9a;--muted:#aaaaaa;--line:#2e2e2e;
    --btn-border:#3f3f3f;--btn-hover:#ffffff;--panel:#1e1e1e;
    --active-bg:#2563eb;--active-text:#ffffff;--input-border:#2563eb;--clock-face:#262626;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:44px 20px 36px}
  .top-info{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:960px;margin-bottom:18px;gap:16px}
  .digital-clock{font-size:48px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;color:var(--text);line-height:1}
  .calendar-card{flex:none;width:120px;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
  .cal-header{background:#2563eb;color:#fff;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
  .cal-month{font-size:12px;font-weight:600}
  .cal-weekday{font-size:11px;opacity:0.85}
  .cal-day{background:#fff;color:#2563eb;font-size:42px;font-weight:800;text-align:center;padding:8px 0;line-height:1}
  html.dark .cal-day{background:#1e1e1e;color:#60a5fa}
  .search-box{width:100%;max-width:960px}
  .engine-tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .engine-tabs button{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--btn-border);border-radius:6px;background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;transition:color .15s,border-color .15s}
  .engine-tabs button.active{background:var(--active-bg);color:var(--active-text);border-color:var(--active-bg)}
  .e-icon{width:18px;height:18px;border-radius:4px;flex:none;object-fit:contain;background:#fff;padding:1px}
  .e-name{display:none}
  #search-form{display:flex;gap:0}
  #search-input{flex:1;min-height:46px;padding:0 16px;border:2px solid var(--input-border);border-radius:16px 0 0 16px;font-size:16px;outline:none;background:var(--panel);color:var(--text)}
  #search-form button{min-height:46px;padding:0 24px;border:none;border-radius:0 16px 16px 0;background:var(--active-bg);color:var(--active-text);font-size:15px;cursor:pointer}
  .quote{margin-top:20px;max-width:960px;text-align:center;line-height:1.8}
  .quote-cn{font-size:15px;color:var(--muted)}
  .quote-en{font-size:13px;color:var(--sub);margin-top:4px}
  .divider{width:100%;max-width:960px;height:1px;background:var(--line);margin:26px 0}
  .quick-links{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:960px;margin-bottom:6px}
  .quick-card{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:20px 24px;border:1px solid var(--btn-border);border-radius:12px;color:var(--text);text-decoration:none;transition:border-color .15s,background .15s}
  .quick-card:hover{border-color:var(--btn-hover);background:var(--panel)}
  .quick-card-main{grid-row:span 2}
  .qc-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  .qc-desc{font-size:14px;color:var(--sub)}
  .qc-api{font-size:13px;color:var(--sub);background:var(--panel);border:1px dashed var(--btn-border);border-radius:6px;padding:6px 8px;align-self:stretch;overflow-wrap:anywhere;line-height:1.7;white-space:pre-line}
  .quick-card-tall{grid-row:span 2;justify-content:flex-start;padding:22px 24px}
  .gc-block{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px dashed var(--btn-border);border-radius:6px;padding:6px 8px}
  .gc-title{font-size:13px;font-weight:700;color:var(--text)}
  .gc-next{font-size:14px;font-weight:700;color:var(--text)}
  .gc-clock-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .gc-clock{flex:none;width:200px;height:200px}
  .gc-clock .face{fill:var(--clock-face);stroke:var(--btn-border);stroke-width:1.5}
  .gc-clock .dot{fill:#ffffff;stroke:var(--btn-border);stroke-width:1}
  .gc-clock .dot.active{fill:#f59e0b;stroke:#f59e0b}
  .gc-clock .tlabel{fill:var(--text);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  .gc-clock .hand{stroke:var(--text);stroke-linecap:round}
  .gc-clock .hand-hr{stroke-width:5}.gc-clock .hand-min{stroke-width:3}.gc-clock .hand-sec{stroke:#f59e0b;stroke-width:1.6}
  .gc-clock .hub{fill:var(--text)}
  .gc-info{display:flex;flex-direction:column;gap:2px;min-width:120px}
  .gc-info-label{font-size:11px;color:var(--sub)}
  .gc-num{font-size:18px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .gc-state{font-size:13px;font-weight:700;color:var(--sub)}
  .gc-state.active{color:#f59e0b}
  .qc-mini{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;border:1px solid var(--btn-border);border-radius:12px}
  .qc-mini a{padding:6px 18px;border:1px solid var(--btn-border);border-radius:999px;color:var(--muted);font-size:14px;text-decoration:none;transition:color .15s,border-color .15s}
  .qc-mini a:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  .extra-sections{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:960px;margin-top:16px}
  .section-card{background:var(--panel);border:1px solid var(--btn-border);border-radius:12px;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
  .section-card.wide{grid-column:1 / -1}
  .section-title{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
  .section-title .icon{font-size:18px}
  .section-content{font-size:14px;color:var(--muted);line-height:1.8}
  .section-content .loading{color:var(--sub);font-style:italic}
  .section-content .error{color:#ef4444}
  .section-select{padding:6px 12px;border:1px solid var(--btn-border);border-radius:6px;background:var(--panel);color:var(--text);font-size:14px;cursor:pointer;outline:none}
  .section-btn{padding:6px 16px;border:1px solid var(--active-bg);border-radius:6px;background:var(--active-bg);color:#fff;font-size:13px;cursor:pointer;transition:background .15s}
  .section-btn:hover{background:#1d4ed8}
  .section-btn.secondary{background:transparent;color:var(--muted);border-color:var(--btn-border)}
  .section-btn.secondary:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  .news-list{list-style:none;display:flex;flex-direction:column;gap:8px}
  .news-list li{display:flex;gap:8px;align-items:baseline}
  .news-list .rank{flex:none;width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:var(--active-bg);color:#fff;font-size:11px;font-weight:700;border-radius:4px}
  .news-list .rank.other{background:var(--btn-border);color:var(--muted)}
  .news-list a{color:var(--muted);text-decoration:none;font-size:13px;line-height:1.5;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .news-list a:hover{color:var(--active-bg)}
  .news-list .meta{flex:none;font-size:11px;color:var(--sub)}
  .game-card{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .game-card:last-child{border-bottom:none}
  .game-thumb{flex:none;width:60px;height:34px;background:var(--line);border-radius:4px;object-fit:cover}
  .game-info{flex:1;min-width:0}
  .game-title{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .game-platform{font-size:11px;color:var(--sub);margin-top:2px}
  .game-worth{font-size:11px;color:#22c55e;font-weight:600;margin-top:2px}
  .tarot-card{text-align:center;padding:10px 0}
  .tarot-name{font-size:18px;font-weight:700;color:var(--text)}
  .tarot-meaning{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
  .mbti-type{font-size:28px;font-weight:800;color:var(--active-bg);letter-spacing:2px}
  .mbti-name{font-size:15px;font-weight:600;color:var(--text);margin-top:4px}
  .mbti-desc{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
  .fortune-item{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
  .fortune-item .label{color:var(--sub)}
  .fortune-item .value{color:var(--text);font-weight:600}
  .fortune-stars{color:#f59e0b;letter-spacing:1px}
  .divination-result{text-align:center;padding:10px 0}
  .divination-level{font-size:20px;font-weight:800;color:var(--active-bg)}
  .divination-poem{font-size:14px;color:var(--text);margin-top:8px;line-height:1.8;white-space:pre-line}
  .divination-meaning{font-size:12px;color:var(--sub);margin-top:8px}
  .hero-item{display:flex;align-items:center;gap:10px;padding:6px 0}
  .hero-avatar{flex:none;width:40px;height:40px;border-radius:6px;background:var(--line);object-fit:cover}
  .hero-name{font-size:14px;font-weight:600;color:var(--text)}
  .hero-title{font-size:12px;color:var(--sub)}
  .calendar-detail{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
  .calendar-detail .item{display:flex;flex-direction:column;gap:2px}
  .calendar-detail .label{font-size:11px;color:var(--sub)}
  .calendar-detail .value{font-weight:600;color:var(--text)}
  .rmrb-quote{font-size:14px;color:var(--text);line-height:1.8;font-style:italic}
  .rmrb-source{font-size:12px;color:var(--sub);margin-top:6px;text-align:right}
  @media (max-width:768px){
    .quick-links{grid-template-columns:1fr}
    .quick-card-main,.quick-card-tall{grid-row:auto}
    .extra-sections{grid-template-columns:1fr}
  }
</style>
<script>
  try { if (localStorage.getItem('hean-theme') !== 'light') document.documentElement.classList.add('dark'); } catch (e) {}
</script>
</head>

<main>

    <div class="section-card">

</main>

<script>
(function() {
  var cn = document.getElementById('daily-cn');
  var en = document.getElementById('daily-en');
  if (!cn) return;
  fetch('https://api.t1qq.com/api/tool/daytry?key=aN4ga1sIvr4we5IfkAjhY68JOc&time=random')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.data) {
        if (data.data.note) cn.textContent = data.data.note;
        if (en && data.data.content) en.textContent = data.data.content;
      }
    })
    .catch(function() { cn.textContent = '路漫漫其修远兮，吾将上下而求索'; });
})();
</script>
<script>
(function () {
  "use strict";
  var WEEKDAYS = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  function tickTopInfo() {
    var now = new Date();
    var clockEl = document.getElementById("digital-clock");
    if (clockEl) clockEl.textContent = (now.getHours()<10?"0"+now.getHours():now.getHours()) + ":" + (now.getMinutes()<10?"0"+now.getMinutes():now.getMinutes());
    var monthEl = document.getElementById("cal-month");
    var weekdayEl = document.getElementById("cal-weekday");
    var dayEl = document.getElementById("cal-day");
    if (monthEl) monthEl.textContent = now.getFullYear() + "年" + (now.getMonth()+1) + "月";
    if (weekdayEl) weekdayEl.textContent = WEEKDAYS[now.getDay()];
    if (dayEl) dayEl.textContent = now.getDate();
  }
  tickTopInfo();
  setInterval(tickTopInfo, 1000);
  var engines = {bing:"https://www.bing.com/search?q=",baidu:"https://www.baidu.com/s?wd=",google:"https://www.google.com/search?q=",netease:"https://music.163.com/#/search/m/?s="};
  var current = "bing";
  var tabs = document.getElementById("engine-tabs");
  var input = document.getElementById("search-input");
  var form = document.getElementById("search-form");
  tabs.addEventListener("click", function(e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    current = btn.getAttribute("data-engine");
    tabs.querySelectorAll("button").forEach(function(b) { b.classList.toggle("active", b===btn); });
    input.focus();
  });
  form.addEventListener("submit", function(e) {
    e.preventDefault();
    var q = input.value.trim();
    if (q==="") return;
    window.open(engines[current] + encodeURIComponent(q), "_blank");
  });
  fetch("https://api.qmkjcm.cn/api/gy_mr_rw/")
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var el = document.getElementById("sky-api");
      if (!el || !data.data || !data.data.task_list || !data.data.task_list.length) return;
      var list = data.data.task_list;
      var today = list[0].date;
      var tasks = list.filter(function(t) { return t.date===today; }).map(function(t) { return t.quest_cn; });
      el.textContent = tasks.length ? "今日任务：\n" + tasks.map(function(t,i) { return (i+1)+". "+t; }).join("\n") : "今日暂无任务";
    })
    .catch(function() { var el = document.getElementById("sky-api"); if (el) el.textContent = "今日任务加载失败"; });
  function nextCs2Reset() {
    var now = new Date();
    var t = new Date(now);
    t.setUTCHours(1,0,0,0);
    var dayDiff = (3 - t.getUTCDay() + 7) % 7;
    if (dayDiff===0 && now.getTime()>=t.getTime()) dayDiff = 7;
    t.setUTCDate(t.getUTCDate() + dayDiff);
    return t;
  }
  function tickCs2() {
    var el = document.getElementById("cs2-api");
    if (!el) return;
    var diff = nextCs2Reset().getTime() - Date.now();
    if (diff<0) diff = 0;
    var s = Math.floor(diff/1000);
    var d = Math.floor(s/86400); s %= 86400;
    var h = Math.floor(s/3600); s %= 3600;
    var m = Math.floor(s/60); s %= 60;
    el.textContent = "距离箱子刷新还有 "+d+"天"+h+"时"+m+"分"+s+"秒";
  }
  tickCs2();
  setInterval(tickCs2, 1000);
  var FEED_TIMES = [[8,0],[10,0],[12,0],[16,0],[18,0],[20,0]];
  var FEED_DUR = 30;
  function pad2(n) { return n<10?"0"+n:""+n; }
  (function buildClock() {
    var svg = document.getElementById("gc-clock");
    if (!svg) return;
    var NS = "http://www.w3.org/2000/svg";
    var cx = 130, cy = 130;
    FEED_TIMES.forEach(function(t,i) {
      var ang = (-90 + i*60) * Math.PI / 180;
      var dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", cx + 82*Math.cos(ang));
      dot.setAttribute("cy", cy + 82*Math.sin(ang));
      dot.setAttribute("r", 6);
      dot.setAttribute("class", "dot");
      dot.setAttribute("id", "feed-dot-"+i);
      svg.appendChild(dot);
      var txt = document.createElementNS(NS, "text");
      txt.setAttribute("x", cx + 110*Math.cos(ang));
      txt.setAttribute("y", cy + 110*Math.sin(ang));
      txt.setAttribute("class", "tlabel");
      txt.textContent = pad2(t[0]) + ":" + pad2(t[1]);
      svg.appendChild(txt);
    });
  })();
  function tickFeed() {
    var elNow = document.getElementById("gc-now");
    var elCount = document.getElementById("gc-countdown");
    var elNext = document.getElementById("gc-next");
    var elLabel = document.getElementById("gc-count-label");
    var elState = document.getElementById("gc-state");
    var handHr = document.getElementById("hand-hr");
    var handMin = document.getElementById("hand-min");
    var handSec = document.getElementById("hand-sec");
    if (!elNow) return;
    var now = new Date(Date.now() + 8*3600*1000);
    var h = now.getUTCHours(), m = now.getUTCMinutes(), s = now.getUTCSeconds();
    var curMin = h*60 + m;
    var i;
    elNow.textContent = pad2(h)+":"+pad2(m)+":"+pad2(s);
    var activeIdx = -1;
    for (i=0; i<FEED_TIMES.length; i++) {
      var start = FEED_TIMES[i][0]*60 + FEED_TIMES[i][1];
      if (curMin>=start && curMin<start+FEED_DUR) { activeIdx = i; break; }
    }
    var nextIdx = -1, nextStart = 0;
    for (i=0; i<FEED_TIMES.length; i++) {
      var st = FEED_TIMES[i][0]*60 + FEED_TIMES[i][1];
      if (curMin < st) { nextIdx = i; nextStart = st; break; }
    }
    var crossDay = false;
    if (nextIdx === -1) { nextIdx = 0; nextStart = FEED_TIMES[0][0]*60; crossDay = true; }
    var totalSec;
    if (activeIdx >= 0) {
      elNext.textContent = "老奶奶正在派发馒头";
      if (elLabel) elLabel.textContent = "本次派发剩余";
      if (elState) { elState.textContent = "老奶奶正在派发馒头"; elState.classList.add("active"); }
      totalSec = (FEED_TIMES[activeIdx][0]*60 + FEED_TIMES[activeIdx][1] + FEED_DUR)*60 - (curMin*60 + s);
    } else {
      elNext.textContent = (crossDay?"明天 ":"今天 ") + "干饭：" + pad2(FEED_TIMES[nextIdx][0]) + ":" + pad2(FEED_TIMES[nextIdx][1]);
      if (elLabel) elLabel.textContent = "距离下次干饭";
      if (elState) { elState.textContent = "现在没饭吃"; elState.classList.remove("active"); }
      var diffMin = nextStart - curMin;
      if (diffMin <= 0) diffMin += 1440;
      totalSec = diffMin*60 - s;
    }
    if (totalSec < 0) totalSec = 0;
    var hh = Math.floor(totalSec/3600);
    var mm = Math.floor((totalSec%3600)/60);
    var ss = totalSec % 60;
    elCount.textContent = pad2(hh)+":"+pad2(mm)+":"+pad2(ss);
    for (i=0; i<FEED_TIMES.length; i++) {
      var d = document.getElementById("feed-dot-"+i);
      if (d) d.classList.toggle("active", i===activeIdx);
    }
    var hrAng = ((h%12)*30 + m*0.5) * Math.PI / 180;
    var minAng = (m*6 + s*0.1) * Math.PI / 180;
    var secAng = s*6 * Math.PI / 180;
    if (handHr) { handHr.setAttribute("x2", 130+45*Math.sin(hrAng)); handHr.setAttribute("y2", 130-45*Math.cos(hrAng)); }
    if (handMin) { handMin.setAttribute("x2", 130+62*Math.sin(minAng)); handMin.setAttribute("y2", 130-62*Math.cos(minAng)); }
    if (handSec) { handSec.setAttribute("x2", 130+70*Math.sin(secAng)); handSec.setAttribute("y2", 130-70*Math.cos(secAng)); }
  }
  tickFeed();
  setInterval(tickFeed, 1000);
})();
</script>

    {level:"下下签",poem:"鱼龙混杂意相同\n耐守寒窗暂处穷\n玉石一别需仔细\n后来必有高人逢",meaning:"近期不顺，需耐心等待。宜守不宜攻。"},
    {level:"上吉签",poem:"一帆风顺去安康\n出外求财大吉昌\n婚姻合伙皆如意\n生意兴隆财满堂",meaning:"财运亨通，出行顺利。宜把握机会。"},
    {level:"中吉签",poem:"枯木逢春又发枝\n旧事重新再得宜\n凡事营谋皆遂意\n家门和顺福相随",meaning:"否极泰来，旧事成新。宜把握转机。"},
    {level:"上上签",poem:"紫微高照运势通\n求财求官事事隆\n婚姻合和添贵子\n家门和顺福无穷",meaning:"福星高照，万事亨通。宜大展宏图。"}
  ];
  window.loadDivination = function() {
    var idx = Math.floor(Math.random() * DIVINATIONS.length);
    var d = DIVINATIONS[idx];
    setContent("divination-content", '<div class="divination-result"><div class="divination-level">' + d.level + '</div><div class="divination-poem">' + d.poem + '</div><div class="divination-meaning">' + d.meaning + '</div></div>');
  };

  function loadRmrb() {
    setContent("rmrb-content", '<span class="loading">加载中...</span>');
    fetch("https://api.qhsou.com/api/rmrb.php")
      .then(function(r) { return r.text(); })
      .then(function(text) {
        if (text && text.length > 10) {
          setContent("rmrb-content", '<div class="rmrb-quote">' + text.substring(0, 200) + '</div><div class="rmrb-source">—— 人民日报</div>');
        } else { setContent("rmrb-content", '<span class="error">金句加载失败</span>'); }
      })
      .catch(function() {
        var quotes = ["岁月因青春慨然以赴而更加静好，世间因少年挺身向前而更加瑰丽。","奋斗是青春最亮丽的底色，行动是青年最有效的磨砺。","路虽远，行则将至；事虽难，做则必成。","青年一代有理想、有本领、有担当，国家就有前途，民族就有希望。"];
        var q = quotes[Math.floor(Math.random() * quotes.length)];
        setContent("rmrb-content", '<div class="rmrb-quote">' + q + '</div><div class="rmrb-source">—— 人民日报（备用）</div>');
      });
  }

  function loadAiNews() {
    setContent("ainews-content", '<span class="loading">加载中...</span>');
    fetch("https://hacker-news.firebaseio.com/v0/topstories.json")
      .then(function(r) { return r.json(); })
      .then(function(ids) {
        var aiKeywords = ["ai","gpt","llm","model","openai","anthropic","claude","gemini","deepmind","machine learning","neural","transformer","diffusion","stable diffusion","midjourney","copilot","agent","rag","embedding"];
        var promises = ids.slice(0, 30).map(function(id) {
          return fetch("https://hacker-news.firebaseio.com/v0/item/" + id + ".json").then(function(r) { return r.json(); });
        });
        return Promise.all(promises).then(function(items) {
          var aiItems = items.filter(function(item) {
            if (!item || !item.title) return false;
            var title = item.title.toLowerCase();
            return aiKeywords.some(function(kw) { return title.indexOf(kw) !== -1; });
          });
          if (aiItems.length === 0) aiItems = items.slice(0, 5);
          var html = '<ul class="news-list">';
          aiItems.slice(0, 5).forEach(function(item, i) {
            var url = item.url || ("https://news.ycombinator.com/item?id=" + item.id);
            html += '<li><span class="rank ' + (i<3?"":"other") + '">' + (i+1) + '</span>' +
              '<a href="' + url + '" target="_blank" rel="noopener" title="' + item.title + '">' + item.title + '</a>' +
              '<span class="meta">💬' + (item.descendants || 0) + '</span></li>';
          });
          html += '</ul>';
          setContent("ainews-content", html);
        });
      })
      .catch(function() { setContent("ainews-content", '<span class="error">AI 新闻加载失败</span>'); });
  }

  function loadDailyNews() {
    setContent("dailynews-content", '<span class="loading">加载中...</span>');
    fetch("https://hacker-news.firebaseio.com/v0/topstories.json")
      .then(function(r) { return r.json(); })
      .then(function(ids) {
        var promises = ids.slice(0, 10).map(function(id) {
          return fetch("https://hacker-news.firebaseio.com/v0/item/" + id + ".json").then(function(r) { return r.json(); });
        });
        return Promise.all(promises);
      })
      .then(function(items) {
        var html = '<ul class="news-list">';
        items.forEach(function(item, i) {
          if (!item || !item.title) return;
          var url = item.url || ("https://news.ycombinator.com/item?id=" + item.id);
          var domain = "";
          try { if (item.url) domain = new URL(item.url).hostname.replace("www.",""); } catch(e) {}
          html += '<li><span class="rank ' + (i<3?"":"other") + '">' + (i+1) + '</span>' +
            '<a href="' + url + '" target="_blank" rel="noopener" title="' + item.title + '">' + item.title + '</a>' +
            '<span class="meta">' + (domain ? domain + ' · ' : '') + '⭐' + (item.score || 0) + '</span></li>';
        });
        html += '</ul>';
        setContent("dailynews-content", html);
      })
      .catch(function() { setContent("dailynews-content", '<span class="error">热点新闻加载失败</span>'); });
  }

  loadGithub();
  loadFreeGames();
  loadMbti();
  loadRmrb();
  loadAiNews();
  loadDailyNews();
})();
