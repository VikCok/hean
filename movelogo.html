<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAN 字母动画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{
  position:relative;
  background:transparent;
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;
  overflow:hidden;
}
.hean-stage{
  --hr-speed:0.9s;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:var(--hr-size);
  height:var(--hr-size);
}
.intro-quote{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:100%;
  opacity:1;
  transition:opacity 0.5s ease;
  pointer-events:none;
}
.q-main{
  font-size:calc(var(--hr-font) * 0.30);
  font-weight:540;
  color:var(--hr-color);
  white-space:nowrap;
  letter-spacing:1px;
  line-height:1.5;
}
.q-src{
  margin-top:10px;
  font-size:calc(var(--hr-font) * 0.22);
  color:var(--hr-color);
  opacity:0.5;
  white-space:nowrap;
  letter-spacing:1px;
  transition:opacity 1.5s ease;
}
.qc{transition:opacity 1.5s ease;display:inline}
.qc-keep{position:relative;z-index:5;transition:opacity 0.4s ease}
body.phase-extract .qc:not(.qc-keep){opacity:0}
body.phase-extract .q-src{opacity:0}
body.phase-popup .qc-keep{opacity:0;transition:opacity 0.3s ease}
body.phase-popup .intro-quote{opacity:0;transition:opacity 0.5s ease 0.3s}
.hean-popup{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:0.35em;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease, transform 2s cubic-bezier(.25,.46,.45,.94);
}
.hp-he,.hp-an{
  font-size:calc(var(--hr-font) * 1.15);
  font-weight:900;
  color:var(--hr-color);
  line-height:1;
  transform:scale(0);
  transition:transform 2s cubic-bezier(.25,.46,.45,.94);
}
body.phase-popup .hean-popup{opacity:1}
body.phase-popup .hp-he,body.phase-popup .hp-an{transform:scale(1)}
body.phase-merge .hean-popup{gap:0.08em;transition:gap 2s linear}
.hean-label{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:0.08em;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
}
.hl-he,.hl-an{
  font-size:calc(var(--hr-font) * 0.48);
  font-weight:900;
  color:var(--hr-color);
  letter-spacing:1px;
  line-height:1;
  transform:translateY(-1.6em) scale(0);
  transition:transform 2s cubic-bezier(.34,1.2,.64,1),font-size 2s ease;
}
body.phase-label .hean-label{opacity:1}
body.phase-label .hl-he,body.phase-label .hl-an{transform:translateY(-1.6em) scale(1)}
body.phase-replace .hp-he,body.phase-replace .hp-an{opacity:0;transition:opacity 0.4s ease}
body.phase-replace .hl-he,body.phase-replace .hl-an{
  transform:translateY(0) scale(1);
  font-size:calc(var(--hr-font) * 1.0);
}
body.phase-magnet .hean-label{gap:0;transition:gap 2s cubic-bezier(.5,1.6,.5,1)}
body.phase-magnet .hl-he,body.phase-magnet .hl-an{
  font-size:calc(var(--hr-font) * 0.95);
}
.anim-letter{
  position:absolute;
  top:50%;left:50%;
  width:1.15em;height:1.15em;
  display:flex;align-items:center;justify-content:center;
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",system-ui,sans-serif;
  font-size:var(--hr-font);
  font-weight:900;
  color:var(--hr-color);
  line-height:1;
  transform:translate(-50%,-50%);
  transition:transform var(--hr-speed) cubic-bezier(.45,0,.15,1),font-size 0.5s ease;
  user-select:none;
  -webkit-user-select:none;
  opacity:0;
}
.anim-letter.pos-0{ transform:translate(calc(-50% - (var(--hr-size) * 0.20)),calc(-50% - (var(--hr-size) * 0.20))); }
.anim-letter.pos-1{ transform:translate(calc(-50% + (var(--hr-size) * 0.20)),calc(-50% - (var(--hr-size) * 0.20))); }
.anim-letter.pos-2{ transform:translate(calc(-50% + (var(--hr-size) * 0.20)),calc(-50% + (var(--hr-size) * 0.20))); }
.anim-letter.pos-3{ transform:translate(calc(-50% - (var(--hr-size) * 0.20)),calc(-50% + (var(--hr-size) * 0.20))); }
body.phase-loop .anim-letter{opacity:1;transition:opacity 0.5s ease}
body.phase-loop .intro-quote,
body.phase-loop .hean-popup,
body.phase-loop .hean-label{opacity:0;transition:opacity 0.4s ease;pointer-events:none}
body.phase-loop-done .intro-quote,
body.phase-loop-done .hean-popup,
body.phase-loop-done .hean-label{display:none}
</style>
</head>
<body>

<div class="hean-stage" id="hean-stage">
  <div class="intro-quote" id="intro-quote">
    <div class="q-main">
      <span class="qc">䅁</span><span class="qc">，</span><span class="qc">轢</span><span class="qc">禾</span><span class="qc">也</span><span class="qc">。</span><span class="qc">从</span><span class="qc qc-keep">禾</span><span class="qc">，</span><span class="qc qc-keep">安</span><span class="qc">聲</span><span class="qc">。</span>
    </div>
    <div class="q-src">东汉·许慎《说文解字》卷七</div>
  </div>
  <div class="hean-popup" id="hean-popup">
    <div class="hp-he">禾</div>
    <div class="hp-an">安</div>
  </div>
  <div class="hean-label" id="hean-label">
    <div class="hl-he">HE</div>
    <div class="hl-an">AN</div>
  </div>
  <span class="anim-letter">H</span>
  <span class="anim-letter">E</span>
  <span class="anim-letter">A</span>
  <span class="anim-letter">N</span>
</div>

<script>
(function () {
  "use strict";
  var STEP_DURATION     = 2000;
  var ROTATE_INTERVAL   = 1900;
  var HORIZONTAL_HOLD   = 5000;
  var HORIZONTAL_OFFSETS = [-110, -37, 37, 110];

  function syncTheme() {
    try {
      var isDark = parent.document.documentElement.classList.contains('dark');
      document.documentElement.style.setProperty('--hr-color', isDark ? '#ffffff' : '#1a1a1a');
    } catch (e) {
      document.documentElement.style.setProperty('--hr-color', '#ffffff');
    }
  }

  var stage     = document.getElementById("hean-stage");
  var letters   = stage.querySelectorAll(".anim-letter");
  var positions = [0, 1, 3, 2];
  var rotateCount  = 0;
  var isAnimating  = false;
  var rotateTimer  = null;
  var introTimers  = [];

  function applyPositions() {
    for (var i = 0; i < letters.length; i++) {
      letters[i].className = "anim-letter pos-" + positions[i];
    }
  }

  function setHorizontal() {
    for (var i = 0; i < letters.length; i++) {
      var off = HORIZONTAL_OFFSETS[i];
      if (off >= 0) {
        letters[i].style.transform = 'translate(calc(-50% + ' + off + 'px),-50%)';
      } else {
        letters[i].style.transform = 'translate(calc(-50% - ' + Math.abs(off) + 'px),-50%)';
      }
    }
  }

  function clearHorizontal() {
    for (var i = 0; i < letters.length; i++) {
      letters[i].style.transform = '';
    }
    positions = [0, 1, 3, 2];
    applyPositions();
  }

  function calcFlyOffset() {
    var keeps = stage.querySelectorAll(".qc-keep");
    if (keeps.length < 2) return { x: 0, y: 0 };
    var heRect = keeps[0].getBoundingClientRect();
    var anRect = keeps[1].getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    var quoteCenterX = (heRect.left + heRect.width / 2 + anRect.left + anRect.width / 2) / 2;
    var quoteCenterY = (heRect.top + heRect.height / 2 + anRect.top + anRect.height / 2) / 2;
    var stageCenterX = stageRect.left + stageRect.width / 2;
    var stageCenterY = stageRect.top + stageRect.height / 2;
    return { x: quoteCenterX - stageCenterX, y: quoteCenterY - stageCenterY };
  }

  function setPopupInitial() {
    var popup = document.getElementById("hean-popup");
    if (!popup) return;
    var offset = calcFlyOffset();
    popup.style.transform = 'translate(calc(-50% + ' + offset.x + 'px), calc(-50% + ' + offset.y + 'px)) scale(0.3)';
    popup.style.transition = 'none';
    void popup.offsetWidth;
    popup.style.transition = '';
  }

  function rotateClockwise() {
    if (isAnimating) return;
    positions = positions.map(function (p) { return (p + 1) % 4; });
    applyPositions();
    rotateCount++;
    if (rotateCount >= 4) {
      if (rotateTimer) { clearInterval(rotateTimer); rotateTimer = null; }
      setTimeout(function () {
        resetAndRestart();
      }, 900);
    }
  }

  function resetAndRestart() {
    introTimers.forEach(function (t) { clearTimeout(t); });
    introTimers = [];
    if (rotateTimer) { clearInterval(rotateTimer); rotateTimer = null; }
    document.body.classList.remove(
      'phase-extract','phase-popup','phase-merge',
      'phase-label','phase-replace','phase-magnet',
      'phase-loop','phase-loop-done'
    );
    for (var i = 0; i < letters.length; i++) {
      letters[i].style.transform = '';
      letters[i].style.fontSize = '';
      letters[i].className = 'anim-letter';
    }
    positions = [0, 1, 3, 2];
    rotateCount = 0;
    isAnimating = false;
    var popup = document.getElementById("hean-popup");
    if (popup) {
      popup.style.transform = '';
      popup.style.opacity = '';
    }
    setTimeout(function () {
      setPopupInitial();
      startIntro();
    }, 50);
  }

  function startLoop() {
    document.body.classList.add('phase-loop');
    setHorizontal();
    introTimers.push(setTimeout(function () {
      document.body.classList.add('phase-loop-done');
    }, 500));
    introTimers.push(setTimeout(function () {
      for (var i = 0; i < letters.length; i++) {
        letters[i].style.fontSize = 'calc(var(--hr-font) * 1.15)';
      }
      clearHorizontal();
      introTimers.push(setTimeout(function () {
        isAnimating = false;
        rotateCount = 0;
        rotateTimer = setInterval(rotateClockwise, ROTATE_INTERVAL);
      }, 900));
    }, HORIZONTAL_HOLD));
  }

  function startIntro() {
    introTimers.push(setTimeout(function () {
      document.body.classList.add('phase-extract');
    }, 2000));
    introTimers.push(setTimeout(function () {
      document.body.classList.add('phase-popup');
      var popup = document.getElementById("hean-popup");
      if (popup) popup.style.transform = '';
    }, 4000));
    introTimers.push(setTimeout(function () {
      document.body.classList.add('phase-merge');
    }, 6000));
    introTimers.push(setTimeout(function () {
      document.body.classList.add('phase-label');
    }, 8000));
    introTimers.push(setTimeout(function () {
      document.body.classList.add('phase-replace');
    }, 10000));
    introTimers.push(setTimeout(function () {
      document.body.classList.add('phase-magnet');
    }, 12000));
    introTimers.push(setTimeout(function () {
      startLoop();
    }, 14000));
  }

  function fitSize() {
    var size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
    if (size < 20) size = 20;
    document.documentElement.style.setProperty('--hr-size', size + 'px');
    document.documentElement.style.setProperty('--hr-font', (size * 0.32) + 'px');
  }
  fitSize();
  window.addEventListener('resize', fitSize);

  syncTheme();
  try {
    new MutationObserver(syncTheme).observe(parent.document.documentElement, {
      attributes: true,
      attributeFilter: ['class']
    });
  } catch (e) {}

  setPopupInitial();
  startIntro();
})();
</script>

</body>
</html>
