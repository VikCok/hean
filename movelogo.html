<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAN 字母旋转动画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{position:relative;background:transparent;font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;overflow:hidden}
.hean-rotate{
  --hr-speed:0.9s;
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:var(--hr-size);height:var(--hr-size);
}
.hean-rotate span{
  position:absolute;top:50%;left:50%;
  width:1.15em;height:1.15em;
  display:flex;align-items:center;justify-content:center;
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",system-ui,sans-serif;
  font-size:var(--hr-font);font-weight:900;color:var(--hr-color);
  line-height:1;transform:translate(-50%,-50%);
  transition:transform var(--hr-speed) cubic-bezier(.45,0,.15,1);
  user-select:none;-webkit-user-select:none;
}
.hean-rotate span.pos-0{ transform:translate(calc(-50% - (var(--hr-size) * 0.20)),calc(-50% - (var(--hr-size) * 0.20))); }
.hean-rotate span.pos-1{ transform:translate(calc(-50% + (var(--hr-size) * 0.20)),calc(-50% - (var(--hr-size) * 0.20))); }
.hean-rotate span.pos-2{ transform:translate(calc(-50% + (var(--hr-size) * 0.20)),calc(-50% + (var(--hr-size) * 0.20))); }
.hean-rotate span.pos-3{ transform:translate(calc(-50% - (var(--hr-size) * 0.20)),calc(-50% + (var(--hr-size) * 0.20))); }
</style>
</head>
<body>
<div class="hean-rotate" id="hean-stage">
  <span>H</span><span>E</span><span>A</span><span>N</span>
</div>
<script>
(function () {
  "use strict";
  var ROTATE_INTERVAL = 1900;
  var TRIGGER_AFTER   = 4;
  var HORIZONTAL_HOLD = 4000;
  function syncTheme() {
    try {
      var isDark = parent.document.body.classList.contains('dark');
      document.documentElement.style.setProperty('--hr-color', isDark ? '#ffffff' : '#1a1a1a');
    } catch (e) {
      document.documentElement.style.setProperty('--hr-color', '#1a1a1a');
    }
  }
  var stage     = document.getElementById("hean-stage");
  var letters   = stage.querySelectorAll("span");
  var positions = [0, 1, 3, 2];
  var rotateCount  = 0;
  var isAnimating  = false;
  var nextAnim     = 3;
  function applyPositions() {
    for (var i = 0; i < letters.length; i++) {
      letters[i].className = "pos-" + positions[i];
    }
  }
  function rotateClockwise() {
    if (isAnimating) return;
    positions = positions.map(function (p) { return (p + 1) % 4; });
    applyPositions();
    rotateCount++;
    if (rotateCount >= TRIGGER_AFTER) {
      var h = positions[0], e = positions[1];
      if (h === 0 && e === 1) { anim3_horizontal(); }
    }
  }
  function anim3_horizontal() {
    isAnimating = true;
    var hOffsets = [-110, -37, 37, 110];
    for (var i = 0; i < letters.length; i++) {
      var off = hOffsets[i];
      if (off >= 0) {
        letters[i].style.transform = 'translate(calc(-50% + ' + off + 'px),-50%)';
      } else {
        letters[i].style.transform = 'translate(calc(-50% - ' + Math.abs(off) + 'px),-50%)';
      }
    }
    setTimeout(function () {
      for (var i = 0; i < letters.length; i++) {
        letters[i].style.transform = '';
      }
      positions = [0, 1, 3, 2];
      applyPositions();
      setTimeout(function () {
        isAnimating = false;
        rotateCount = 0;
        nextAnim = 3;
      }, 900);
    }, HORIZONTAL_HOLD);
  }
  function fitSize() {
    var size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
    if (size < 20) size = 20;
    document.documentElement.style.setProperty('--hr-size', size + 'px');
    document.documentElement.style.setProperty('--hr-font', (size * 0.32) + 'px');
  }
  fitSize();
  window.addEventListener('resize', fitSize);
  applyPositions();
  syncTheme();
  try {
    new MutationObserver(syncTheme).observe(parent.document.body, {
      attributes: true, attributeFilter: ['class']
    });
  } catch (e) {}
  setInterval(rotateClockwise, ROTATE_INTERVAL);
})();
</script>
</body>
</html>
