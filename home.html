<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAN 禾安</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  :root{
    --bg:#ffffff;--text:#333333;--sub:#888888;--muted:#555555;
    --line:#e5e5e5;--btn-border:#cccccc;--btn-hover:#111111;--panel:#ffffff;
    --active-bg:#333333;--active-text:#ffffff;--input-border:#333333;--clock-face:#f6f6f6;
  }
  body.dark{
    --bg:#121212;--text:#e8e8e8;--sub:#9a9a9a;--muted:#aaaaaa;
    --line:#2e2e2e;--btn-border:#3f3f3f;--btn-hover:#ffffff;--panel:#1e1e1e;
    --active-bg:#e8e8e8;--active-text:#121212;--input-border:#666666;--clock-face:#262626;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:44px 20px 36px}
  .main-title{font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:6px;text-align:center;line-height:1.2}
  .sub-title{margin-top:10px;margin-bottom:30px;text-align:center;font-size:15px;color:var(--sub);letter-spacing:2px}
  .search-box{width:100%;max-width:960px}
  .divider{width:100%;max-width:960px;height:1px;background:var(--line);margin:26px 0}
  .quick-links{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:960px;margin-bottom:6px}
  .quick-card{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:20px 24px;border:1px solid var(--btn-border);border-radius:12px;color:var(--text);text-decoration:none;transition:border-color .15s,background .15s}
  .quick-card:hover{border-color:var(--btn-hover);background:var(--panel)}
  .quick-card-main{grid-row:span 2}
  .qc-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  .qc-desc{font-size:14px;color:var(--sub)}
  .qc-api{font-size:13px;color:var(--sub);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--panel);border:1px dashed var(--btn-border);border-radius:6px;padding:6px 8px;align-self:stretch;overflow-wrap:anywhere;line-height:1.7;white-space:pre-line}
  .quick-card-tall{grid-row:span 2;justify-content:flex-start;padding:22px 24px}
  .gc-block{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px dashed var(--btn-border);border-radius:6px;padding:6px 8px}
  .gc-title{font-size:13px;font-weight:700;color:var(--text)}
  .gc-next{font-size:14px;font-weight:700;color:var(--text)}
  .gc-clock-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .gc-clock{flex:none;width:200px;height:200px}
  .gc-clock .face{fill:var(--clock-face);stroke:var(--btn-border);stroke-width:1.5}
  .gc-clock .dot{fill:#ffffff;stroke:var(--btn-border);stroke-width:1}
  .gc-clock .dot.active{fill:#f59e0b;stroke:#f59e0b}
  .gc-clock .tlabel{fill:var(--text);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  .gc-clock .hand{stroke:var(--text);stroke-linecap:round}
  .gc-clock .hand-hr{stroke-width:5}
  .gc-clock .hand-min{stroke-width:3}
  .gc-clock .hand-sec{stroke:#f59e0b;stroke-width:1.6}
  .gc-clock .hub{fill:var(--text)}
  .gc-info{display:flex;flex-direction:column;gap:2px;min-width:120px}
  .gc-info-label{font-size:11px;color:var(--sub)}
  .gc-num{font-size:18px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .gc-state{font-size:13px;font-weight:700;color:var(--sub)}
  .gc-state.active{color:#f59e0b}
  .qc-mini{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;border:1px solid var(--btn-border);border-radius:12px}
  .qc-mini a{padding:6px 18px;border:1px solid var(--btn-border);border-radius:999px;color:var(--muted);font-size:14px;text-decoration:none;transition:color .15s,border-color .15s}
  .qc-mini a:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  .engine-tabs{display:flex;gap:8px;margin-bottom:10px}
  .engine-tabs button{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--btn-border);border-radius:6px;background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;transition:color .15s,border-color .15s}
  .engine-tabs button.active{background:var(--active-bg);color:var(--active-text);border-color:var(--active-bg)}
  .e-icon{width:18px;height:18px;border-radius:4px;flex:none;object-fit:contain;background:#fff;padding:1px}
  #search-form{display:flex;gap:0}
  #search-input{flex:1;min-height:46px;padding:0 16px;border:2px solid var(--input-border);border-radius:8px 0 0 8px;font-size:16px;outline:none;background:var(--panel);color:var(--text)}
  #search-form button{min-height:46px;padding:0 24px;border:none;border-radius:0 8px 8px 0;background:var(--active-bg);color:var(--active-text);font-size:15px;cursor:pointer}
  .quote{margin-top:20px;max-width:960px;text-align:center;font-size:15px;color:var(--muted);line-height:1.8}
  .quote-line{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap}
  .quote #quote-src{font-size:13px;color:var(--sub)}
  @media (max-width:768px){.quick-links{grid-template-columns:1fr}.quick-card-main,.quick-card-tall{grid-row:auto}}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
  <h1 class="main-title">HEAN 禾安</h1>
  <p class="sub-title">Vik Hean Core</p>
  <section class="search-box">
    <div class="engine-tabs" id="engine-tabs">
      <button type="button" data-engine="bing" class="active"><img class="e-icon" src="assets/logo-bing.png" alt="Bing">微软Bing</button>
      <button type="button" data-engine="baidu"><img class="e-icon" src="assets/logo-baidu.png" alt="百度">百度</button>
      <button type="button" data-engine="google"><img class="e-icon" src="assets/logo-google.png" alt="Google">Google</button>
    </div>
    <form id="search-form" action="javascript:void(0)">
      <input type="text" id="search-input" placeholder="搜索一下" autocomplete="off">
      <button type="submit">搜索</button>
    </form>
  </section>
  <section class="quote"><p class="quote-line"><span id="quote-text">加载中…</span><span id="quote-src"></span></p></section>
  <div class="divider"></div>
  <nav class="quick-links">
    <a class="quick-card quick-card-main" href="nav.html"><span class="qc-title">导航页</span><span class="qc-desc">站点导航 · 快速入口</span></a>
    <a class="quick-card quick-card-tall" href="sky.html">
      <span class="qc-title">光遇</span>
      <div class="gc-block">
        <div class="gc-title">老奶奶干饭时间</div>
        <div class="gc-next" id="gc-next">计算中…</div>
        <div class="gc-clock-wrap">
          <svg class="gc-clock" id="gc-clock" viewBox="0 0 260 260" role="img" aria-label="干饭时间时钟">
            <circle class="face" cx="130" cy="130" r="118"/>
            <line class="hand hand-hr" id="hand-hr" x1="130" y1="130" x2="130" y2="85"/>
            <line class="hand hand-min" id="hand-min" x1="130" y1="130" x2="130" y2="68"/>
            <line class="hand hand-sec" id="hand-sec" x1="130" y1="130" x2="130" y2="60"/>
            <circle class="hub" cx="130" cy="130" r="5"/>
          </svg>
          <div class="gc-info">
            <span class="gc-info-label">现在时间</span><span class="gc-num" id="gc-now">--:--:--</span>
            <span class="gc-info-label" id="gc-count-label">距离下次干饭</span><span class="gc-num" id="gc-countdown">--:--:--</span>
            <span class="gc-state" id="gc-state">--</span>
          </div>
        </div>
      </div>
      <span class="qc-api" id="sky-api">小陈跑路中…</span>
    </a>
    <a class="quick-card" href="cs2.html"><span class="qc-title">CS2</span><span class="qc-api" id="cs2-api">计算中…</span></a>
    <div class="qc-mini"><a href="news.html">新闻</a></div>
  </nav>
</main>
<div id="site-footer"></div>
<script src="components.js"></script>
<script>
(function(){
"use strict";
var engines={bing:"https://www.bing.com/search?q=",baidu:"https://www.baidu.com/s?wd=",google:"https://www.google.com/search?q="};
var current="bing";
var tabs=document.getElementById("engine-tabs"),input=document.getElementById("search-input"),form=document.getElementById("search-form");
tabs.addEventListener("click",function(e){var btn=e.target.closest("button");if(!btn)return;current=btn.getAttribute("data-engine");tabs.querySelectorAll("button").forEach(function(b){b.classList.toggle("active",b===btn)});input.focus()});
form.addEventListener("submit",function(e){e.preventDefault();var q=input.value.trim();if(q==="")return;window.open(engines[current]+encodeURIComponent(q),"_blank")});
fetch("https://v1.hitokoto.cn/").then(function(r){return r.json()}).then(function(d){document.getElementById("quote-text").textContent=d.hitokoto;document.getElementById("quote-src").textContent=d.from?"—— "+d.from:""}).catch(function(){document.getElementById("quote-text").textContent="每日一言加载失败，请稍后刷新重试。"});
fetch("https://api.qmkjcm.cn/api/gy_mr_rw/").then(function(r){return r.json()}).then(function(d){var el=document.getElementById("sky-api");if(!el||!d.data||!d.data.task_list||!d.data.task_list.length)return;var list=d.data.task_list,today=list[0].date,tasks=list.filter(function(t){return t.date===today}).map(function(t){return t.quest_cn});el.textContent=tasks.length?"今日任务：\n"+tasks.map(function(t,i){return(i+1)+". "+t}).join("\n"):"今日暂无任务"}).catch(function(){var el=document.getElementById("sky-api");if(el)el.textContent="今日任务加载失败"});
function nextCs2Reset(){var now=new Date(),t=new Date(now);t.setUTCHours(1,0,0,0);var dd=(3-t.getUTCDay()+7)%7;if(dd===0&&now.getTime()>=t.getTime())dd=7;t.setUTCDate(t.getUTCDate()+dd);return t}
function tickCs2(){var el=document.getElementById("cs2-api");if(!el)return;var diff=nextCs2Reset().getTime()-Date.now();if(diff<0)diff=0;var s=Math.floor(diff/1000),d=Math.floor(s/86400);s%=86400;var h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60);s%=60;el.textContent="距离箱子刷新还有 "+d+"天"+h+"时"+m+"分"+s+"秒"}
tickCs2();setInterval(tickCs2,1000);
var FEED_TIMES=[[8,0],[10,0],[12,0],[16,0],[18,0],[20,0]],FEED_DUR=30;
function pad2(n){return n<10?"0"+n:""+n}
(function buildClock(){var svg=document.getElementById("gc-clock");if(!svg)return;var NS="http://www.w3.org/2000/svg",cx=130,cy=130;FEED_TIMES.forEach(function(t,i){var ang=(-90+i*60)*Math.PI/180;var dot=document.createElementNS(NS,"circle");dot.setAttribute("cx",cx+82*Math.cos(ang));dot.setAttribute("cy",cy+82*Math.sin(ang));dot.setAttribute("r",6);dot.setAttribute("class","dot");dot.setAttribute("id","feed-dot-"+i);svg.appendChild(dot);var txt=document.createElementNS(NS,"text");txt.setAttribute("x",cx+110*Math.cos(ang));txt.setAttribute("y",cy+110*Math.sin(ang));txt.setAttribute("class","tlabel");txt.textContent=pad2(t[0])+":"+pad2(t[1]);svg.appendChild(txt)})})();
function tickFeed(){var elNow=document.getElementById("gc-now"),elCount=document.getElementById("gc-countdown"),elNext=document.getElementById("gc-next"),elLabel=document.getElementById("gc-count-label"),elState=document.getElementById("gc-state"),handHr=document.getElementById("hand-hr"),handMin=document.getElementById("hand-min"),handSec=document.getElementById("hand-sec");if(!elNow)return;var now=new Date(Date.now()+8*3600*1000),h=now.getUTCHours(),m=now.getUTCMinutes(),s=now.getUTCSeconds(),curMin=h*60+m,i;elNow.textContent=pad2(h)+":"+pad2(m)+":"+pad2(s);var activeIdx=-1;for(i=0;i<FEED_TIMES.length;i++){var start=FEED_TIMES[i][0]*60+FEED_TIMES[i][1];if(curMin>=start&&curMin<start+FEED_DUR){activeIdx=i;break}}var nextIdx=-1,nextStart=0;for(i=0;i<FEED_TIMES.length;i++){var st=FEED_TIMES[i][0]*60+FEED_TIMES[i][1];if(curMin<st){nextIdx=i;nextStart=st;break}}var crossDay=false;if(nextIdx===-1){nextIdx=0;nextStart=FEED_TIMES[0][0]*60;crossDay=true}var totalSec;if(activeIdx>=0){elNext.textContent="老奶奶正在派发馒头";if(elLabel)elLabel.textContent="本次派发剩余";if(elState){elState.textContent="老奶奶正在派发馒头";elState.classList.add("active")}totalSec=(FEED_TIMES[activeIdx][0]*60+FEED_TIMES[activeIdx][1]+FEED_DUR)*60-(curMin*60+s)}else{elNext.textContent=(crossDay?"明天 ":"今天 ")+"干饭："+pad2(FEED_TIMES[nextIdx][0])+":"+pad2(FEED_TIMES[nextIdx][1]);if(elLabel)elLabel.textContent="距离下次干饭";if(elState){elState.textContent="现在没饭吃";elState.classList.remove("active")}var diffMin=nextStart-curMin;if(diffMin<=0)diffMin+=1440;totalSec=diffMin*60-s}if(totalSec<0)totalSec=0;var hh=Math.floor(totalSec/3600),mm=Math.floor((totalSec%3600)/60),ss=totalSec%60;elCount.textContent=pad2(hh)+":"+pad2(mm)+":"+pad2(ss);for(i=0;i<FEED_TIMES.length;i++){var d=document.getElementById("feed-dot-"+i);if(d)d.classList.toggle("active",i===activeIdx)}var hrAng=((h%12)*30+m*0.5)*Math.PI/180,minAng=(m*6+s*0.1)*Math.PI/180,secAng=s*6*Math.PI/180;if(handHr){handHr.setAttribute("x2",130+45*Math.sin(hrAng));handHr.setAttribute("y2",130-45*Math.cos(hrAng))}if(handMin){handMin.setAttribute("x2",130+62*Math.sin(minAng));handMin.setAttribute("y2",130-62*Math.cos(minAng))}if(handSec){handSec.setAttribute("x2",130+70*Math.sin(secAng));handSec.setAttribute("y2",130-70*Math.cos(secAng))}}
tickFeed();setInterval(tickFeed,1000);
})();
</script>
</body>
</html>
