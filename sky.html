<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAN 光遇</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  /* ===== 主题变量：日间模式（默认） ===== */
  :root{
    --bg:#ffffff;
    --text:#333333;
    --sub:#888888;
    --muted:#555555;
    --line:#e5e5e5;
    --btn-border:#cccccc;
    --btn-hover:#111111;
    --panel:#ffffff;
    --active-bg:#333333;
    --active-text:#ffffff;
    --input-border:#333333;
    --clock-face:#f6f6f6;
    --band-bg:#f3f3f3;
  }
  /* ===== 主题变量：暗黑模式（body 加 dark 类时覆盖） ===== */
  body.dark{
    --bg:#121212;
    --text:#e8e8e8;
    --sub:#9a9a9a;
    --muted:#aaaaaa;
    --line:#2e2e2e;
    --btn-border:#3f3f3f;
    --btn-hover:#ffffff;
    --panel:#1e1e1e;
    --active-bg:#e8e8e8;
    --active-text:#121212;
    --input-border:#666666;
    --clock-face:#262626;
    --band-bg:#1a1a1a;
  }
  /* 基础重置：清除默认边距，统一盒模型 */
  *{margin:0;padding:0;box-sizing:border-box}
  /* 页面基础：flex 纵向布局撑满视口，主题切换带过渡 */
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--text);
    transition:background .2s,color .2s;
  }
  /* 主体区域 */
  main{flex:1}
  /* 页面内容容器：画幅放宽，减少留白 */
  .page{
    width:100%;max-width:1080px;margin:0 auto;
    padding:40px 24px 56px;
  }
  /* 大老奶奶横版栏：全宽置顶，替换原页面大标题 */
  .gc-block-big{
    display:flex;flex-direction:column;gap:12px;
    background:var(--panel);border:1px solid var(--btn-border);
    border-radius:16px;padding:28px 32px;
    max-width:960px;
  }
  /* 栏内所有内容正常排列 */
  .gc-block-big>*{position:relative;z-index:1}
  .gc-title-big{font-size:22px;font-weight:800;color:var(--text)}
  /* 光遇一言：位于老奶奶横版栏下方 */
  .yiyan{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    max-width:960px;margin:16px 0;
    font-size:15px;color:var(--muted);line-height:1.8;
  }
  .yiyan-src{font-size:13px;color:var(--sub)}
  /* 时钟 + 右侧信息：水平并排，间距加大 */
  .gc-clock-wrap{display:flex;align-items:center;gap:48px;flex-wrap:wrap}
  .gc-clock{flex:none;width:280px;height:280px}
  /* 圆形时钟：表盘 / 白色实心时间点 / 时间文字 / 指针 */
  .gc-clock .face{fill:var(--clock-face);stroke:var(--btn-border);stroke-width:1.5}
  .gc-clock .dot{fill:#ffffff;stroke:var(--btn-border);stroke-width:1}
  .gc-clock .dot.active{fill:#f59e0b;stroke:#f59e0b}
  .gc-clock .tlabel{fill:var(--text);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  .gc-clock .hand{stroke:var(--text);stroke-linecap:round}
  .gc-clock .hand-hr{stroke-width:5}
  .gc-clock .hand-min{stroke-width:3}
  .gc-clock .hand-sec{stroke:#f59e0b;stroke-width:1.6}
  .gc-clock .hub{fill:var(--text)}
  /* 右侧信息：当前时间与倒计时同字号、精确到秒，区域加宽加大 */
  .gc-info{display:flex;flex-direction:column;gap:8px;min-width:260px}
  .gc-info-label{font-size:14px;color:var(--sub)}
  .gc-num{
    font-size:32px;font-weight:700;letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  /* 右侧状态行：派发中显示"派发馒头"（橙色高亮），否则显示"现在没饭吃" */
  .gc-state{font-size:18px;font-weight:700;color:var(--sub)}
  .gc-state.active{color:#f59e0b}
  /* 双列卡片网格 */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:960px}
  /* 卡片通用标题 */
  .card-title{font-size:16px;font-weight:700;color:var(--text)}
  /* 今日任务卡片 */
  .task-block{
    display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--btn-border);
    border-radius:12px;padding:20px 24px;
    max-width:960px;
  }
  .task-text{font-size:15px;color:var(--muted);line-height:1.9;white-space:pre-line}
  /* 任务刷新倒计时：每日 0 点（北京时间）重置，标注为刷新时间 */
  .refresh-line{font-size:12px;color:var(--sub);display:flex;align-items:baseline;gap:6px}
  .refresh-line b{font-variant-numeric:tabular-nums;color:var(--text)}
  /* 通用数据卡片 */
  .mf-block,.db-block{
    display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--btn-border);
    border-radius:12px;padding:20px 24px;
  }
  .db-img{width:100%;height:auto;border-radius:8px;display:block}
  .db-text{font-size:14px;color:var(--sub)}
  .cards-gap-top{margin-top:16px}
  /* 长文本卡片正文：保留换行 */
  .long-text{font-size:14px;color:var(--muted);line-height:1.9;white-space:pre-line}
  /* 大蜡地图图片行：地图小图并排 */
  .lzwz-imgs{display:flex;gap:8px;flex-wrap:wrap}
  .lzwz-imgs img{height:96px;width:auto;border-radius:8px;border:1px solid var(--btn-border)}
  /* 季节剩余大数字 */
  .djs-days{font-size:20px;font-weight:800;color:#f59e0b}
  /* 官方公告 卡片（默认折叠5行） */
  .gg-block{
    display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--btn-border);
    border-radius:12px;padding:20px 24px;
    max-width:960px;margin-top:16px;
  }
  .gg-title{font-size:15px;font-weight:700;color:var(--text)}
  .gg-text{
    font-size:14px;color:var(--muted);line-height:1.9;white-space:pre-line;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;
    overflow:hidden;
  }
  .gg-text.open{-webkit-line-clamp:unset}
  .gg-more{
    align-self:flex-start;margin-top:4px;padding:4px 14px;
    border:1px solid var(--btn-border);border-radius:999px;background:var(--panel);
    color:var(--muted);font-size:12px;cursor:pointer;transition:color .15s,border-color .15s;
  }
  .gg-more:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  /* 复刻先祖（独立卡片） */
  .db-block-alone{margin-top:16px}
  /* 浅色底栏：位于页脚上方，与内容和页脚做视觉区分 */
  .bottom-band{
    background:var(--band-bg);
    border-top:1px solid var(--line);
    padding:20px;
  }
  /* 底栏按钮行：三个跳转按钮居中挨在一起 */
  .band-links{
    max-width:1080px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;
    gap:10px;flex-wrap:wrap;
  }
  /* 底栏胶囊按钮：光遇官方微博 / 光遇官网 / HEAN 主页 */
  .footer-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 16px;border:1px solid var(--btn-border);border-radius:999px;
    color:var(--muted);font-size:13px;text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .footer-btn:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  /* 底栏声明：非官方工具提示（居中） */
  .footer-note{
    max-width:1080px;margin:10px auto 0;text-align:center;
    font-size:12px;color:var(--sub);line-height:1.8;
  }
  /* ===== 移动端适配：窄屏（≤768px）双列卡片改为单列，一排只允许一个栏位 ===== */
  @media (max-width:768px){
    .cards{grid-template-columns:1fr}
  }
</style>
</head>

<script>
(function () {
  "use strict";
  /* ===== 老奶奶干饭时间（圆形时钟版） =====
     6 个派发时段（北京时间 08:00/10:00/12:00/16:00/18:00/20:00，各 30 分钟）。
     时钟为无刻度表盘，圆周上按 60° 间隔标注 6 个时间点：
     08:00 位于正上方，顺时针依次 10:00 / 12:00 / 16:00 / 18:00 / 20:00，
     每个时间点内侧放一个白色实心圆点（位于表盘边缘），当前派发时段圆点高亮为橙色。 */
  var FEED_TIMES = [[8, 0], [10, 0], [12, 0], [16, 0], [18, 0], [20, 0]];
  var FEED_DUR = 30;
  /* 数字补零：8 -> "08" */
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  /* 构建时钟：为每个时间点生成白色实心圆点（边缘放大） + 时间文字 */
  (function buildClock() {
    var svg = document.getElementById("gc-clock");
    if (!svg) return;
    var NS = "http://www.w3.org/2000/svg";
    var cx = 130, cy = 130;
    FEED_TIMES.forEach(function (t, i) {
      /* 角度：-90°（正上方）为起点，每 60° 顺时针排列一个时间点 */
      var ang = (-90 + i * 60) * Math.PI / 180;
      /* 白色实心圆点：位于半径 98 处（靠近表盘边缘），放大到半径 9 */
      var dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", cx + 98 * Math.cos(ang));
      dot.setAttribute("cy", cy + 98 * Math.sin(ang));
      dot.setAttribute("r", 9);
      dot.setAttribute("class", "dot");
      dot.setAttribute("id", "feed-dot-" + i);
      svg.appendChild(dot);
      /* 时间文字（如 08:00）：位于半径 112 处（圆点外侧，避免与放大圆点重叠） */
      var txt = document.createElementNS(NS, "text");
      txt.setAttribute("x", cx + 112 * Math.cos(ang));
      txt.setAttribute("y", cy + 112 * Math.sin(ang));
      txt.setAttribute("class", "tlabel");
      txt.textContent = pad2(t[0]) + ":" + pad2(t[1]);
      svg.appendChild(txt);
    });
  })();

  /* 每秒刷新：当前时间、干饭状态、倒计时与三根指针 */
  function tickFeed() {
    var elNow = document.getElementById("gc-now");
    var elCount = document.getElementById("gc-countdown");
    var elLabel = document.getElementById("gc-count-label");
    var elState = document.getElementById("gc-state");
    var handHr = document.getElementById("hand-hr");
    var handMin = document.getElementById("hand-min");
    var handSec = document.getElementById("hand-sec");
    if (!elNow) return;
    var now = new Date(Date.now() + 8 * 3600 * 1000); /* 北京时间 */
    var h = now.getUTCHours(), m = now.getUTCMinutes(), s = now.getUTCSeconds();
    var curMin = h * 60 + m;
    var i;

    /* 右侧：当前时间精确到秒 */
    elNow.textContent = pad2(h) + ":" + pad2(m) + ":" + pad2(s);

    /* 任务刷新倒计时：每日 0 点（北京时间）重置 */
    var elRef = document.getElementById("task-refresh");
    if (elRef) {
      var refSec = (1440 - curMin) * 60 - s;
      if (refSec < 0) refSec = 0;
      elRef.textContent = pad2(Math.floor(refSec / 3600)) + ":" +
                          pad2(Math.floor((refSec % 3600) / 60)) + ":" +
                          pad2(refSec % 60);
    }

    /* 判断当前是否在某个派发时段内（用于高亮圆点） */
    var activeIdx = -1;
    for (i = 0; i < FEED_TIMES.length; i++) {
      var start = FEED_TIMES[i][0] * 60 + FEED_TIMES[i][1];
      if (curMin >= start && curMin < start + FEED_DUR) { activeIdx = i; break; }
    }

    /* 计算下一次派发时段（今天之后或明天） */
    var nextIdx = -1, nextStart = 0;
    for (i = 0; i < FEED_TIMES.length; i++) {
      var st = FEED_TIMES[i][0] * 60 + FEED_TIMES[i][1];
      if (curMin < st) { nextIdx = i; nextStart = st; break; }
    }
    var crossDay = false;
    if (nextIdx === -1) { nextIdx = 0; nextStart = FEED_TIMES[0][0] * 60; crossDay = true; }

    /* 倒计时秒数：派发中为本时段剩余，非派发为距下次开始 */
    var totalSec;
    if (activeIdx >= 0) {
      if (elLabel) elLabel.textContent = "本次派发剩余";
      /* 右侧状态行：派发时段内显示橙色高亮的派发提示 */
      if (elState) {
        elState.textContent = "老奶奶正在派发馒头";
        elState.classList.add("active");
      }
      totalSec = (FEED_TIMES[activeIdx][0] * 60 + FEED_TIMES[activeIdx][1] + FEED_DUR) * 60 - (curMin * 60 + s);
    } else {
      if (elLabel) elLabel.textContent = "距离下次干饭";
      /* 右侧状态行：非派发时段显示"现在没饭吃"（常规灰色） */
      if (elState) {
        elState.textContent = "现在没饭吃";
        elState.classList.remove("active");
      }
      var diffMin = nextStart - curMin;
      if (diffMin <= 0) diffMin += 1440;
      totalSec = diffMin * 60 - s;
    }
    if (totalSec < 0) totalSec = 0;
    var hh = Math.floor(totalSec / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;
    /* 倒计时与当前时间同字号同格式，精确到秒 */
    elCount.textContent = pad2(hh) + ":" + pad2(mm) + ":" + pad2(ss);

    /* 高亮当前时段对应的圆点（白色实心圆 -> 橙色） */
    for (i = 0; i < FEED_TIMES.length; i++) {
      var d = document.getElementById("feed-dot-" + i);
      if (d) d.classList.toggle("active", i === activeIdx);
    }

    /* 指针角度：时针 / 分针 / 秒针（从表盘中心向外） */
    var hrAng = ((h % 12) * 30 + m * 0.5) * Math.PI / 180;
    var minAng = (m * 6 + s * 0.1) * Math.PI / 180;
    var secAng = s * 6 * Math.PI / 180;
    if (handHr) {
      handHr.setAttribute("x2", 130 + 45 * Math.sin(hrAng));
      handHr.setAttribute("y2", 130 - 45 * Math.cos(hrAng));
    }
    if (handMin) {
      handMin.setAttribute("x2", 130 + 62 * Math.sin(minAng));
      handMin.setAttribute("y2", 130 - 62 * Math.cos(minAng));
    }
    if (handSec) {
      handSec.setAttribute("x2", 130 + 70 * Math.sin(secAng));
      handSec.setAttribute("y2", 130 - 70 * Math.cos(secAng));
    }
  }
  tickFeed();
  setInterval(tickFeed, 1000);

  /* ===== 今日任务：取最新日期（当天）的 4 条任务，编号竖排 ===== */
  fetch("/qmkproxy/api/gy_mr_rw/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("task-text");
      if (!el || !data.data || !data.data.task_list || !data.data.task_list.length) return;
      var list = data.data.task_list;
      var today = list[0].date;
      var tasks = list.filter(function (t) { return t.date === today; })
                      .map(function (t) { return t.quest_cn; });
      el.textContent = tasks.length ? tasks.map(function (t, i) { return (i + 1) + ". " + t; }).join("\n") : "今日暂无任务";
    })
    .catch(function () {
      var el = document.getElementById("task-text");
      if (el) el.textContent = "今日任务加载失败";
    });

  /* ===== 光遇每日一言：随机语录 + 署名 ===== */
  fetch("/qmkproxy/api/gy/yiyan/yiyan.php")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("yiyan-text");
      var src = document.getElementById("yiyan-src");
      if (el && data.data && data.data.content) {
        el.textContent = data.data.content;
        if (src) src.textContent = data.data.from ? "—— " + data.data.from : "";
      }
    })
    .catch(function () {
      var el = document.getElementById("yiyan-text");
      if (el) el.textContent = "光遇一言加载失败";
    });

  /* ===== 官方公告：标题 + 正文（默认折叠为 5 行，点击展开/收起） ===== */
  fetch("/qmkproxy/api/gy/appgg/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var t = document.getElementById("gg-title");
      var b = document.getElementById("gg-text");
      var btn = document.getElementById("gg-more");
      if (!t || !data.Title) return;
      t.textContent = data.Title;
      if (b) b.textContent = data.OtherChannelMessage || "";
      /* 折叠状态实际行数超出 5 行时，才显示"展开"按钮 */
      if (btn && b) {
        setTimeout(function () {
          if (b.scrollHeight > b.clientHeight + 1) {
            btn.hidden = false;
            btn.addEventListener("click", function () {
              var open = b.classList.toggle("open");
              btn.textContent = open ? "收起" : "展开";
            });
          }
        }, 50);
      }
    })
    .catch(function () {
      var t = document.getElementById("gg-title");
      if (t) t.textContent = "公告加载失败";
    });


  /* ===== 复刻先祖：显示日期 + 当日先祖位置图片 ===== */
  fetch("/qmkproxy/gyapi/rwt/db/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var t = document.getElementById("db-text");
      var img = document.getElementById("db-img");
      if (t && data.date) t.textContent = data.date + " · 复刻先祖";
      if (img && data.image) {
        img.src = data.image;
      }
    })
    .catch(function () {
      var t = document.getElementById("db-text");
      if (t) t.textContent = "代币加载失败";
    });

  /* ===== 活动日历：每日日程提醒，剔除接口末尾的微博话题标签 ===== */
  fetch("/qmkproxy/gyapi/rwt/rl/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("rl-text");
      if (el && data.text) {
        el.textContent = data.text
          .replace(/#超话创作官[\s\S]*$/, "")
          .replace(/\n{2,}/g, "\n")
          .trim();
      }
    })
    .catch(function () {
      var el = document.getElementById("rl-text");
      if (el) el.textContent = "日历加载失败";
    });

  /* ===== 今日黑暗侵蚀（落石点）：只保留位置 / 性质 / 时间三行 ===== */
  fetch("/qmkproxy/gyapi/rwt/lsd/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("lsd-text");
      if (!el || !data.text) return;
      var keep = [];
      data.text.split("\n").forEach(function (ln) {
        var s = ln.trim();
        if (/^(位置|性质|时间)\s*[:：]/.test(s)) keep.push(s);
      });
      el.textContent = keep.length ? keep.join("\n") : data.text.trim();
    })
    .catch(function () {
      var el = document.getElementById("lsd-text");
      if (el) el.textContent = "活动加载失败";
    });

  /* ===== 今日大蜡地图：季蜡位置 + 大蜡位置 + 地图小图 ===== */
  fetch("/t1proxy/api/sky/sc/lzwz?key=aN4ga1sIvr4we5IfkAjhY68JOc")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("lzwz-text");
      var box = document.getElementById("lzwz-imgs");
      if (el) {
        var parts = [];
        if (data.jlwz && data.jlwz.text) parts.push("季蜡位置：" + data.jlwz.text);
        if (data.dlwz && data.dlwz.text) parts.push("大蜡位置：" + data.dlwz.text.join(" / "));
        el.textContent = parts.length ? parts.join("\n") : "今日暂无大蜡";
      }
      if (box) {
        var imgs = [];
        if (data.jlwz && data.jlwz.img) imgs = imgs.concat(data.jlwz.img);
        if (data.dlwz && data.dlwz.img) imgs = imgs.concat(data.dlwz.img);
        box.innerHTML = "";
        imgs.forEach(function (src) {
          var img = document.createElement("img");
          img.src = src;
          img.alt = "大蜡地图";
          box.appendChild(img);
        });
      }
    })
    .catch(function () {
      var el = document.getElementById("lzwz-text");
      if (el) el.textContent = "大蜡位置加载失败";
    });

  /* ===== 季节剩余时间：只输出剩余时间 ===== */
  fetch("/t1proxy/api/sky/sc/gf/djs?key=aN4ga1sIvr4we5IfkAjhY68JOc")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var d1 = document.getElementById("djs-days");
      if (d1 && data.data && data.data.days) d1.textContent = data.data.days;
    })
    .catch(function () {
      var d1 = document.getElementById("djs-days");
      if (d1) d1.textContent = "季节剩余加载失败";
    });

})();
</script>

</body>
</html>
