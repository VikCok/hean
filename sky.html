<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAN 光遇</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  /* ===== 主题变量：日间模式（默认） ===== */
  :root{
    --bg:#ffffff;
    --text:#333333;
    --sub:#888888;
    --muted:#555555;
    --line:#e5e5e5;
    --btn-border:#cccccc;
    --btn-hover:#111111;
    --panel:#ffffff;
    --active-bg:#333333;
    --active-text:#ffffff;
    --input-border:#333333;
    --clock-face:#f6f6f6;
  }
  /* ===== 主题变量：暗黑模式（body 加 dark 类时覆盖） ===== */
  body.dark{
    --bg:#121212;
    --text:#e8e8e8;
    --sub:#9a9a9a;
    --muted:#aaaaaa;
    --line:#2e2e2e;
    --btn-border:#3f3f3f;
    --btn-hover:#ffffff;
    --panel:#1e1e1e;
    --active-bg:#e8e8e8;
    --active-text:#121212;
    --input-border:#666666;
    --clock-face:#262626;
  }
  /* 基础重置：清除默认边距，统一盒模型 */
  *{margin:0;padding:0;box-sizing:border-box}
  /* 页面基础：flex 纵向布局撑满视口，主题切换带过渡 */
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--text);
    transition:background .2s,color .2s;
  }
  /* 顶栏：左侧品牌与导航按钮，右侧主题开关 */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;border-bottom:1px solid var(--line);
  }
  .left{display:flex;align-items:center;gap:14px}
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:18px;font-weight:700;letter-spacing:1px;
    text-decoration:none;color:var(--text);
  }
  /* 主页 / 导航页 胶囊按钮（带图标） */
  .home-btn,.nav-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 16px;border:1px solid var(--btn-border);border-radius:999px;
    color:var(--muted);font-size:14px;text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .home-btn:hover,.nav-btn:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  .home-btn svg,.nav-btn svg{width:16px;height:16px}
  /* 日间/夜间切换：胶囊滑块开关（内嵌太阳/月亮 SVG） */
  .mode-switch{
    position:relative;flex:none;
    width:58px;height:30px;
    border:1px solid var(--btn-border);border-radius:999px;
    background:var(--panel);cursor:pointer;
    transition:background .25s,border-color .25s;
  }
  .mode-switch .thumb{
    position:absolute;top:2px;left:2px;
    width:24px;height:24px;border-radius:50%;
    background:#fdfdfd;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    transition:transform .25s,background .25s;
  }
  body.dark .mode-switch .thumb{transform:translateX(30px)}
  .mode-switch .icon{width:14px;height:14px}
  .mode-switch .icon-moon{display:none}
  body.dark .mode-switch .icon-sun{display:none}
  body.dark .mode-switch .icon-moon{display:block}
  .mode-switch:focus-visible{outline:2px solid var(--btn-hover);outline-offset:2px}
  /* 主体区域 */
  main{flex:1}
  /* 页面内容容器：画幅放宽，减少留白 */
  .page{
    width:100%;max-width:1080px;margin:0 auto;
    padding:40px 24px 56px;
  }
  .page-title{font-size:28px;font-weight:800;letter-spacing:2px;margin-bottom:8px}
  .page-sub{font-size:14px;color:var(--sub);margin-bottom:24px;letter-spacing:1px}
  /* 每日一言：文本与署名并排显示 */
  .yiyan{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    max-width:960px;margin-bottom:16px;
    font-size:15px;color:var(--muted);line-height:1.8;
  }
  .yiyan-src{font-size:13px;color:var(--sub)}
  /* 老奶奶干饭时间卡片 */
  .gc-block{
    display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--btn-border);
    border-radius:12px;padding:20px 24px;
  }
  .gc-title{font-size:16px;font-weight:700;color:var(--text)}
  /* 时钟上方：下一次干饭时间点（派发中则显示派发状态） */
  .gc-next{font-size:15px;font-weight:700;color:var(--text)}
  /* 时钟 + 右侧信息：水平并排 */
  .gc-clock-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .gc-clock{flex:none;width:230px;height:230px}
  /* 圆形时钟：表盘 / 白色实心时间点 / 时间文字 / 指针 */
  .gc-clock .face{fill:var(--clock-face);stroke:var(--btn-border);stroke-width:1.5}
  .gc-clock .dot{fill:#ffffff;stroke:var(--btn-border);stroke-width:1}
  .gc-clock .dot.active{fill:#f59e0b;stroke:#f59e0b}
  .gc-clock .tlabel{fill:var(--text);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  .gc-clock .hand{stroke:var(--text);stroke-linecap:round}
  .gc-clock .hand-hr{stroke-width:5}
  .gc-clock .hand-min{stroke-width:3}
  .gc-clock .hand-sec{stroke:#f59e0b;stroke-width:1.6}
  .gc-clock .hub{fill:var(--text)}
  /* 右侧信息：当前时间与倒计时同字号、精确到秒 */
  .gc-info{display:flex;flex-direction:column;gap:4px;min-width:170px}
  .gc-info-label{font-size:12px;color:var(--sub)}
  .gc-num{
    font-size:24px;font-weight:700;letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  /* 双列卡片网格（干饭 | 任务，魔法 | 代币） */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:960px}
  /* 卡片通用标题 */
  .card-title{font-size:16px;font-weight:700;color:var(--text)}
  /* 今日任务卡片 */
  .task-block{
    display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--btn-border);
    border-radius:12px;padding:20px 24px;
  }
  .task-text{font-size:15px;color:var(--muted);line-height:1.9;white-space:pre-line}
  /* 今日免费魔法 / 今日代币 卡片 */
  .mf-block,.db-block{
    display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--btn-border);
    border-radius:12px;padding:20px 24px;
  }
  .mf-img,.db-img{width:100%;height:auto;border-radius:8px;display:block}
  .mf-text{font-size:14px;color:var(--muted);line-height:1.8}
  .db-text{font-size:14px;color:var(--sub)}
  .cards-gap-top{margin-top:16px}
  /* 文字攻略 / 官方公告 卡片（正文超长时可滚动） */
  .gg-block{
    display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--btn-border);
    border-radius:12px;padding:20px 24px;
    max-width:960px;margin-top:16px;
  }
  .gg-title{font-size:15px;font-weight:700;color:var(--text)}
  .gg-text{
    font-size:14px;color:var(--muted);line-height:1.9;white-space:pre-line;
    max-height:320px;overflow-y:auto;
  }
  /* 页脚：版权 + 免责声明 / 关于本站 */
  footer{
    padding:18px 20px;text-align:center;
    font-size:13px;color:var(--sub);border-top:1px solid var(--line);
  }
  footer a{
    color:var(--muted);text-decoration:none;margin:0 4px;
    transition:color .15s;
  }
  footer a:hover{color:var(--btn-hover)}
  footer .sep{color:var(--line);margin:0 2px}
</style>
</head>

<script>
(function () {
  "use strict";
  /* 主题切换：localStorage 存储 key=hean-theme，实现夜间模式跨页记忆 */
  var btn = document.getElementById("mode-btn");
  if (!btn) return;
  var KEY = "hean-theme";

  try {
    if (localStorage.getItem(KEY) === "dark") {
      document.body.classList.add("dark");
      btn.setAttribute("aria-checked", "true");
    }
  } catch (e) {}

  btn.addEventListener("click", function () {
    var dark = document.body.classList.toggle("dark");
    btn.setAttribute("aria-checked", dark ? "true" : "false");
    try {
      localStorage.setItem(KEY, dark ? "dark" : "light");
    } catch (e) {}
  });
})();
</script>
<script>
(function () {
  "use strict";
  /* ===== 老奶奶干饭时间（圆形时钟版） =====
     6 个派发时段（北京时间 08:00/10:00/12:00/16:00/18:00/20:00，各 30 分钟）。
     时钟为无刻度表盘，圆周上按 60° 间隔标注 6 个时间点：
     08:00 位于正上方，顺时针依次 10:00 / 12:00 / 16:00 / 18:00 / 20:00，
     每个时间点内侧放一个白色实心圆点，当前派发时段圆点高亮为橙色。 */
  var FEED_TIMES = [[8, 0], [10, 0], [12, 0], [16, 0], [18, 0], [20, 0]];
  var FEED_DUR = 30;
  /* 数字补零：8 -> "08" */
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  /* 构建时钟：为每个时间点生成白色实心圆点 + 时间文字 */
  (function buildClock() {
    var svg = document.getElementById("gc-clock");
    if (!svg) return;
    var NS = "http://www.w3.org/2000/svg";
    var cx = 130, cy = 130;
    FEED_TIMES.forEach(function (t, i) {
      /* 角度：-90°（正上方）为起点，每 60° 顺时针排列一个时间点 */
      var ang = (-90 + i * 60) * Math.PI / 180;
      /* 白色实心圆点：位于半径 82 处（时间文字内侧） */
      var dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", cx + 82 * Math.cos(ang));
      dot.setAttribute("cy", cy + 82 * Math.sin(ang));
      dot.setAttribute("r", 6);
      dot.setAttribute("class", "dot");
      dot.setAttribute("id", "feed-dot-" + i);
      svg.appendChild(dot);
      /* 时间文字（如 08:00）：位于半径 110 处（圆点外侧） */
      var txt = document.createElementNS(NS, "text");
      txt.setAttribute("x", cx + 110 * Math.cos(ang));
      txt.setAttribute("y", cy + 110 * Math.sin(ang));
      txt.setAttribute("class", "tlabel");
      txt.textContent = pad2(t[0]) + ":" + pad2(t[1]);
      svg.appendChild(txt);
    });
  })();

  /* 每秒刷新：当前时间、干饭状态、倒计时与三根指针 */
  function tickFeed() {
    var elNow = document.getElementById("gc-now");
    var elCount = document.getElementById("gc-countdown");
    var elNext = document.getElementById("gc-next");
    var elLabel = document.getElementById("gc-count-label");
    var handHr = document.getElementById("hand-hr");
    var handMin = document.getElementById("hand-min");
    var handSec = document.getElementById("hand-sec");
    if (!elNow) return;
    var now = new Date(Date.now() + 8 * 3600 * 1000); /* 北京时间 */
    var h = now.getUTCHours(), m = now.getUTCMinutes(), s = now.getUTCSeconds();
    var curMin = h * 60 + m;
    var i;

    /* 右侧：当前时间精确到秒 */
    elNow.textContent = pad2(h) + ":" + pad2(m) + ":" + pad2(s);

    /* 判断当前是否在某个派发时段内（用于高亮圆点） */
    var activeIdx = -1;
    for (i = 0; i < FEED_TIMES.length; i++) {
      var start = FEED_TIMES[i][0] * 60 + FEED_TIMES[i][1];
      if (curMin >= start && curMin < start + FEED_DUR) { activeIdx = i; break; }
    }

    /* 计算下一次派发时段（今天之后或明天） */
    var nextIdx = -1, nextStart = 0;
    for (i = 0; i < FEED_TIMES.length; i++) {
      var st = FEED_TIMES[i][0] * 60 + FEED_TIMES[i][1];
      if (curMin < st) { nextIdx = i; nextStart = st; break; }
    }
    var crossDay = false;
    if (nextIdx === -1) { nextIdx = 0; nextStart = FEED_TIMES[0][0] * 60; crossDay = true; }

    /* 倒计时秒数：派发中为本时段剩余，非派发为距下次开始 */
    var totalSec;
    if (activeIdx >= 0) {
      elNext.textContent = "老奶奶正在派发馒头";
      if (elLabel) elLabel.textContent = "本次派发剩余";
      totalSec = (FEED_TIMES[activeIdx][0] * 60 + FEED_TIMES[activeIdx][1] + FEED_DUR) * 60 - (curMin * 60 + s);
    } else {
      elNext.textContent = (crossDay ? "明天 " : "今天 ") + "干饭：" + pad2(FEED_TIMES[nextIdx][0]) + ":" + pad2(FEED_TIMES[nextIdx][1]);
      if (elLabel) elLabel.textContent = "距离下次干饭";
      var diffMin = nextStart - curMin;
      if (diffMin <= 0) diffMin += 1440;
      totalSec = diffMin * 60 - s;
    }
    if (totalSec < 0) totalSec = 0;
    var hh = Math.floor(totalSec / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;
    /* 倒计时与当前时间同字号同格式，精确到秒 */
    elCount.textContent = pad2(hh) + ":" + pad2(mm) + ":" + pad2(ss);

    /* 高亮当前时段对应的圆点（白色实心圆 -> 橙色） */
    for (i = 0; i < FEED_TIMES.length; i++) {
      var d = document.getElementById("feed-dot-" + i);
      if (d) d.classList.toggle("active", i === activeIdx);
    }

    /* 指针角度：时针 / 分针 / 秒针（从表盘中心向外） */
    var hrAng = ((h % 12) * 30 + m * 0.5) * Math.PI / 180;
    var minAng = (m * 6 + s * 0.1) * Math.PI / 180;
    var secAng = s * 6 * Math.PI / 180;
    if (handHr) {
      handHr.setAttribute("x2", 130 + 45 * Math.sin(hrAng));
      handHr.setAttribute("y2", 130 - 45 * Math.cos(hrAng));
    }
    if (handMin) {
      handMin.setAttribute("x2", 130 + 62 * Math.sin(minAng));
      handMin.setAttribute("y2", 130 - 62 * Math.cos(minAng));
    }
    if (handSec) {
      handSec.setAttribute("x2", 130 + 70 * Math.sin(secAng));
      handSec.setAttribute("y2", 130 - 70 * Math.cos(secAng));
    }
  }
  tickFeed();
  setInterval(tickFeed, 1000);

  /* ===== 今日任务：取最新日期（当天）的 4 条任务，编号竖排 ===== */
  fetch("/qmkproxy/api/gy_mr_rw/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("task-text");
      if (!el || !data.data || !data.data.task_list || !data.data.task_list.length) return;
      var list = data.data.task_list;
      var today = list[0].date;
      var tasks = list.filter(function (t) { return t.date === today; })
                      .map(function (t) { return t.quest_cn; });
      el.textContent = tasks.length ? tasks.map(function (t, i) { return (i + 1) + ". " + t; }).join("\n") : "今日暂无任务";
    })
    .catch(function () {
      var el = document.getElementById("task-text");
      if (el) el.textContent = "今日任务加载失败";
    });

  /* ===== 光遇每日一言：随机语录 + 署名 ===== */
  fetch("/qmkproxy/api/gy/yiyan/yiyan.php")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("yiyan-text");
      var src = document.getElementById("yiyan-src");
      if (el && data.data && data.data.content) {
        el.textContent = data.data.content;
        if (src) src.textContent = data.data.from ? "—— " + data.data.from : "";
      }
    })
    .catch(function () {
      var el = document.getElementById("yiyan-text");
      if (el) el.textContent = "光遇一言加载失败";
    });

  /* ===== 官方公告：标题 + 正文（保留换行） ===== */
  fetch("/qmkproxy/api/gy/appgg/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var t = document.getElementById("gg-title");
      var b = document.getElementById("gg-text");
      if (!t || !data.Title) return;
      t.textContent = data.Title;
      if (b) b.textContent = data.OtherChannelMessage || "";
    })
    .catch(function () {
      var t = document.getElementById("gg-title");
      if (t) t.textContent = "公告加载失败";
    });

  /* ===== 今日免费魔法文本：接口返回 <pre> 包裹的 JSON，先清洗再解析 ===== */
  fetch("/qmkproxy/api/gy/mfwz/")
    .then(function (res) { return res.text(); })
    .then(function (txt) {
      var el = document.getElementById("mf-text");
      if (!el) return;
      try {
        var data = JSON.parse(txt.replace(/^<pre>/, "").replace(/<\/pre>$/, ""));
        if (data.magic && data.magic.length) {
          el.textContent = "今日免费魔法：" + data.magic.map(function (m) { return m.text; }).join("、");
        }
      } catch (e) {}
    })
    .catch(function () {
      var el = document.getElementById("mf-text");
      if (el) el.textContent = "魔法列表加载失败";
    });

  /* ===== 今日代币：显示日期 + 当日代币位置图片 ===== */
  fetch("/qmkproxy/gyapi/rwt/db/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var t = document.getElementById("db-text");
      var img = document.getElementById("db-img");
      if (t && data.date) t.textContent = data.date + " · 每日代币";
      if (img && data.image) {
        img.src = data.image;
      }
    })
    .catch(function () {
      var t = document.getElementById("db-text");
      if (t) t.textContent = "代币加载失败";
    });

  /* ===== 文字攻略：当日完整攻略摘要（任务/季蜡/大蜡/落石点/复刻等） ===== */
  fetch("/qmkproxy/gyapi/text/")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var el = document.getElementById("guide-text");
      if (el && data.summary) el.textContent = data.summary;
    })
    .catch(function () {
      var el = document.getElementById("guide-text");
      if (el) el.textContent = "攻略加载失败";
    });
})();
</script>

</body>
</html>
