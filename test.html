<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer&Hean · 测试</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  :root{
    --bg:#ffffff;
    --text:#333333;
    --sub:#888888;
    --muted:#555555;
    --line:#e5e5e5;
    --btn-border:#cccccc;
    --btn-hover:#111111;
    --panel:#ffffff;
    --active-bg:#333333;
    --active-text:#ffffff;
    --input-border:#333333;
  }
  body.dark{
    --bg:#121212;
    --text:#e8e8e8;
    --sub:#9a9a9a;
    --muted:#aaaaaa;
    --line:#2e2e2e;
    --btn-border:#3f3f3f;
    --btn-hover:#ffffff;
    --panel:#1e1e1e;
    --active-bg:#e8e8e8;
    --active-text:#121212;
    --input-border:#666666;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--text);
    transition:background .2s,color .2s;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;border-bottom:1px solid var(--line);
  }
  .left{display:flex;align-items:center;gap:14px}
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:18px;font-weight:700;letter-spacing:1px;
    text-decoration:none;color:var(--text);
  }
  #logo{width:32px;height:32px;object-fit:contain}
  .home-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 16px;border:1px solid var(--btn-border);border-radius:999px;
    color:var(--muted);font-size:14px;text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .home-btn:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  .home-btn svg{width:16px;height:16px}
  .mode-btn{
    display:inline-flex;align-items:center;
    padding:8px 18px;border:1px solid var(--btn-border);border-radius:999px;
    background:var(--panel);color:var(--muted);font-size:14px;cursor:pointer;
    transition:color .15s,border-color .15s;
  }
  .mode-btn:hover{color:var(--btn-hover);border-color:var(--btn-hover)}
  main{flex:1}
  footer{
    padding:18px 20px;text-align:center;
    font-size:13px;color:var(--sub);border-top:1px solid var(--line);
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="left">
    <a class="brand" href="index.html">
      <img id="logo" src="assets/logo.png" alt="HEAN 图标" onerror="this.style.display='none'">
      <span>HEAN</span>
    </a>
    <a class="home-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 11l9-8 9 8"/>
        <path d="M5 10v10h14V10"/>
      </svg>
      主页
    </a>
  </div>
  <button class="mode-btn" id="mode-btn" type="button">暗黑</button>
</header>
<main></main>
<footer>
  <p>Copyright © 2026 vikc.dpdns.org All Rights Reserved</p>
</footer>
<script>
(function () {
  "use strict";
  var btn = document.getElementById("mode-btn");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var dark = document.body.classList.toggle("dark");
    btn.textContent = dark ? "白色" : "暗黑";
  });
})();
</script>

</body>
</html>
